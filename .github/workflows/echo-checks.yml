name: Echo reliability checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 小手机
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 小手机/package-lock.json
      - run: npm ci
      - run: npm run vendor:tokenizer && git diff --exit-code -- js/vendor/tokenizer
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=moderate
      # GitHub-hosted Ubuntu runners already include Chromium's native libraries.
      # --with-deps invokes apt against security.ubuntu.com, which can fail on
      # transient DNS outages even though the Playwright browser download works.
      - run: npx playwright install chromium
      - run: npm run test:browser
