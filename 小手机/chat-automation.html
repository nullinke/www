<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聊天设置</title><style>body{margin:0;background:#eef7fc;color:#4e6b80;font-family:system-ui,sans-serif}.phone{max-width:430px;min-height:100vh;margin:auto;padding:24px 20px;box-sizing:border-box}.head{display:flex;align-items:center;gap:16px;margin:28px 0}.head a{color:#6d9fc5;font-size:22px}.head h1{font-size:25px;font-weight:500;font-style:italic;margin:0}.card{background:#fff9;border:1px solid #fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px #8fbad933}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #dbeaf2}.row:last-child{border:0}.row label{flex:1}.row small{display:block;color:#8eaabd;font-size:12px;margin-top:3px}.row input[type=number]{width:70px;border:0;border-bottom:1px solid #b9d4e6;background:transparent;color:#4e6b80;padding:5px}.save{width:100%;padding:13px;border:0;border-radius:22px;background:#82b7dc;color:#fff;font-size:15px}.secondary{width:100%;padding:11px;border:1px solid #a8cbe3;border-radius:22px;background:#fff8;color:#5e8eb1;margin-top:10px}</style></head><body><main class="phone"><header class="head"><a href="chat-list.html" aria-label="返回">‹</a><h1>Chat Settings</h1></header><form id="automation-form"><section class="card"><div class="row"><label for="auto-messages">角色自动发消息<small>按设定间隔主动联系</small></label><input id="auto-messages" type="checkbox"></div><div class="row"><label for="auto-moments">自动发朋友圈<small>根据近期聊天生成动态</small></label><input id="auto-moments" type="checkbox"></div><div class="row"><label for="interval-minutes">发送间隔（分钟）</label><input id="interval-minutes" type="number" min="5" max="1440" step="5"></div></section><section class="card"><div class="row"><label for="include-images">朋友圈带图 / 主动发图<small>需要在模型设置中配置生图接口</small></label><input id="include-images" type="checkbox"></div><div class="row"><label for="show-thoughts">显示心声与思维链<small>仅显示模型返回的 &lt;think&gt; 块，不展示隐藏推理</small></label><input id="show-thoughts" type="checkbox"></div><div class="row"><label for="summary-rounds">自动总结最近轮数<small>作为主动消息和朋友圈的上下文</small></label><input id="summary-rounds" type="number" min="1" max="100"></div></section><button class="save" type="submit">保存设置</button><button class="secondary" type="button" id="run-now">立即执行一次</button></form></main><script type="module" src="js/chat-app.js"></script></body></html>
