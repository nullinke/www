<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo · 锁屏</title>

<!-- 字体: Cormorant Garamond(展示标题) / Liter(英文小标) / MiSans(中文) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Liter&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css" rel="stylesheet">

<style>
/* ============================================================
   Echo · 锁屏 Lock Screen
   全局变量与 design-tokens.css 保持一致
   ============================================================ */
:root {
  /* 颜色 */
  --bg-base: #FDFEFF;
  --bg-base-end: #F0F7FC;
  --blob-blue: rgba(214, 233, 247, 0.55);
  --blob-deep: rgba(174, 211, 236, 0.40);

  --brand-blue: #9CC4E4;
  --brand-blue-deep: #7FA8CC;
  --brand-ink: #4E6B80;
  --brand-deep: #5E7B90;
  --brand-muted: #9DB4C4;
  --line-soft: #C7D9E6;
  --orbit-line: #A8CCE6;
  --icon-inactive: #A9BFCE;
  --home-indicator: #D3E0EA;

  /* 液态玻璃 */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.90);
  --glass-border-width: 1px;
  --blur-radius: 14px;
  --glass-blur: blur(var(--blur-radius)) saturate(1.4);

  /* 阴影 */
  --shadow-glass: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-glow: 0 0 24px rgba(156, 196, 228, 0.65);

  /* 尺寸 */
  --phone-max-w: 420px;
  --disc-size: 248px;          /* 玻璃圆盘直径 */
  --orbit-size: 196px;         /* 粒子轨道直径 */
  --particle-size: 12px;       /* 粒子核心 */
  --particle-glow: 44px;       /* 粒子光晕 */

  /* 字体 */
  --font-zh: "MiSans", "PingFang SC", sans-serif;
  --font-en: "Liter", sans-serif;
  --font-display: "Cormorant Garamond", serif;

  /* 动效参数 */
  --orbit-duration: 8s;        /* 粒子绕圈一周 */
  --glow-duration: 2.4s;       /* 光晕呼吸 */
  --fade-delay: 1s;            /* 文字延迟淡入 */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-zh);
  background: #EAF2F8;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

/* ---------- 手机外框(移动端占满, 桌面端居中限宽) ---------- */
.phone {
  width: 100%;
  max-width: var(--phone-max-w);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;           /* 仅为背景光斑提供包含块, 不参与布局 */
  background: linear-gradient(135deg, var(--bg-base), var(--bg-base-end));
}

@media (min-width: 480px) {
  body { align-items: center; padding: 24px 0; }
  .phone {
    min-height: 844px;
    border-radius: 40px;
    box-shadow: 0 24px 64px rgba(94, 123, 144, 0.25);
  }
}

/* 背景光斑(纯装饰) */
.phone::before,
.phone::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.phone::before {
  width: 430px; height: 400px;
  top: -110px; left: -70px;
  background: radial-gradient(circle, var(--blob-blue) 0%, transparent 70%);
}
.phone::after {
  width: 360px; height: 340px;
  bottom: 40px; right: -120px;
  background: radial-gradient(circle, var(--blob-deep) 0%, transparent 70%);
}

/* ---------- 状态栏 ---------- */
.status-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 0;
  color: var(--icon-inactive);
}
.status-bar svg { display: block; }

/* ---------- 主舞台 ---------- */
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 48px;
  padding: 24px;
}

/* 玻璃圆盘 */
.disc {
  width: var(--disc-size);
  height: var(--disc-size);
  border-radius: 50%;
  position: relative;           /* 仅约束圆盘内部, 不影响全局布局 */
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 38%, rgba(255,255,255,0.85), var(--glass-bg) 65%);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-glass), inset 0 1px 0 rgba(255,255,255,0.9);
}

/* 轨道细环 */
.disc__orbit {
  width: var(--orbit-size);
  height: var(--orbit-size);
  border-radius: 50%;
  border: 1px solid var(--orbit-line);
  opacity: 0.9;
}

/* 旋转层: 粒子 + 拖尾, 纯 CSS 动效, 可整体移除 */
.disc__spinner {
  position: absolute;
  inset: calc((var(--disc-size) - var(--orbit-size)) / 2);
  animation: orbit-spin var(--orbit-duration) linear infinite;
}

/* 粒子拖尾(约 90° 弧, 跟在粒子后方) */
.disc__trail {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: rgba(156, 196, 228, 0.85);
  border-right-color: rgba(156, 196, 228, 0.15);
  transform: rotate(-45deg);    /* 末端对齐顶部粒子, 弧向后展开 */
}

/* 发光粒子 */
.disc__particle {
  position: absolute;
  top: calc(var(--particle-glow) / -2);
  left: calc(50% - var(--particle-glow) / 2);
  width: var(--particle-glow);
  height: var(--particle-glow);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(156,196,228,0.35) 55%, transparent 75%);
  animation: glow-breathe var(--glow-duration) ease-in-out infinite;
}
.disc__particle::after {
  content: "";
  position: absolute;
  inset: calc((var(--particle-glow) - var(--particle-size)) / 2);
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #FFFFFF, var(--brand-blue-deep));
  box-shadow: var(--shadow-glow);
}

/* 文字区 */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  animation: fade-up 0.9s ease var(--fade-delay) both;
}
.brand__title {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 46px;
  letter-spacing: 5px;
  line-height: 1.2;
  color: var(--brand-deep);
}
.brand__divider {
  width: 56px;
  height: 1px;
  background: var(--line-soft);
}
.brand__subtitle {
  font-family: var(--font-en);
  font-size: 10.5px;
  letter-spacing: 4.5px;
  text-transform: uppercase;
  color: var(--brand-muted);
}

/* ---------- 底部 Home 指示条 ---------- */
.home-indicator {
  display: flex;
  justify-content: center;
  padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 14px);
}
.home-indicator::before {
  content: "";
  width: 134px;
  height: 5px;
  border-radius: 2.5px;
  background: var(--home-indicator);
}

/* ---------- 动效 ---------- */
@keyframes orbit-spin {
  to { transform: rotate(360deg); }
}
@keyframes glow-breathe {
  0%, 100% { opacity: 0.75; transform: scale(0.92); }
  50%      { opacity: 1;    transform: scale(1.05); }
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 尊重系统减弱动效设置 */
@media (prefers-reduced-motion: reduce) {
  .disc__spinner, .disc__particle, .brand { animation: none; }
}
</style>
</head>

<body>
  <div class="phone" id="lock-screen">

    <!-- 状态栏(纯展示 Mock) -->
    <header class="status-bar" id="status-bar" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="4" y="6" width="3" height="9" rx="1"/><rect x="8" y="3" width="3" height="12" rx="1"/><rect x="12" y="0" width="3" height="15" rx="1"/></svg>
      <svg width="16" height="15" viewBox="0 0 16 15" fill="currentColor"><path d="M8 12.5a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2ZM8 8.6c1.5 0 2.9.6 3.9 1.6l-1.4 1.4a3.6 3.6 0 0 0-5 0l-1.4-1.4A5.6 5.6 0 0 1 8 8.6Zm0-4.2c2.7 0 5.2 1.1 7 2.9l-1.4 1.4a7.8 7.8 0 0 0-11.2 0L1 7.3a9.8 9.8 0 0 1 7-2.9Z" transform="translate(0 -4)"/></svg>
      <svg width="22" height="15" viewBox="0 0 25 15" fill="none" stroke="currentColor"><rect x="0.5" y="1.5" width="20" height="12" rx="3.5"/><rect x="3" y="4" width="13" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 5.5v4" stroke-width="1.5" stroke-linecap="round"/></svg>
    </header>

    <!-- 锁屏主舞台 -->
    <main class="stage" id="lock-stage">

      <!-- 玻璃圆盘 + 轨道粒子(点按可绑定解锁, id 预留) -->
      <div class="disc" id="lock-disc">
        <div class="disc__orbit"></div>
        <div class="disc__spinner" aria-hidden="true">
          <div class="disc__trail"></div>
          <div class="disc__particle"></div>
        </div>
      </div>

      <!-- 品牌文字 -->
      <section class="brand" id="lock-brand">
        <h1 class="brand__title">Echo</h1>
        <div class="brand__divider" aria-hidden="true"></div>
        <p class="brand__subtitle">A Quiet Space</p>
      </section>

    </main>

    <!-- Home 指示条 -->
    <footer class="home-indicator" id="home-indicator" aria-hidden="true"></footer>

  </div>
</body>
</html>
