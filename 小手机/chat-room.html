<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo · Nereus</title>

<!-- 字体: Cormorant Garamond(展示标题) / Liter(英文小标) / MiSans(中文) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Liter&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css" rel="stylesheet">
<!-- 图标: Font Awesome 6 字体图标(纯 CSS, 无 JS) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   Echo · 全局设计变量(所有页面单文件内保持一致的副本)
   与 design-tokens.css 同步
   ============================================================ */
:root {
  /* 颜色 */
  --bg-base: #FDFEFF;
  --bg-base-end: #F0F7FC;
  --blob-blue: rgba(214, 233, 247, 0.55);
  --blob-deep: rgba(174, 211, 236, 0.40);
  --blob-cyan: rgba(205, 235, 240, 0.38);

  --brand-blue: #9CC4E4;
  --brand-blue-deep: #7FA8CC;
  --brand-ink: #4E6B80;
  --brand-deep: #5E7B90;
  --brand-muted: #9DB4C4;
  --line-soft: #C7D9E6;
  --divider: #E7EFF5;
  --track: #E2EDF5;
  --chevron: #C2D3DF;
  --icon-tint: #7FA8CC;
  --icon-inactive: #A9BFCE;
  --home-indicator: #D3E0EA;

  /* 头像渐变 */
  --avatar-a-start: #CFE4F4;           /* 对方头像(亮蓝) */
  --avatar-a-end: #9CC4E4;
  --avatar-b-start: #E4EEF6;           /* 我方/群聊头像(灰蓝) */
  --avatar-b-end: #B8CFE0;

  /* 聊天气泡 */
  --bubble-peer-bg: rgba(255, 255, 255, 0.62);
  --bubble-mine-bg: rgba(156, 196, 228, 0.28);
  --radius-bubble-peer: 4px 20px 20px 20px;
  --radius-bubble-mine: 20px 4px 20px 20px;

  /* 液态玻璃 */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.90);
  --glass-border-width: 1px;
  --blur-radius: 12px;
  --glass-blur: blur(var(--blur-radius)) saturate(1.4);

  /* 阴影 */
  --shadow-glass: 0 8px 20px rgba(143, 186, 217, 0.18);
  --shadow-glass-lg: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-tabbar: 0 12px 28px rgba(143, 186, 217, 0.25);

  /* 圆角 */
  --radius-card-lg: 24px;
  --radius-card: 22px;
  --radius-pill: 22px;
  --radius-tabbar: 24px;
  --radius-chip: 13px;
  --radius-avatar: 50%;

  /* 尺寸 */
  --phone-max-w: 420px;
  --page-padding-x: 20px;
  --tabbar-height: 70px;
  --tabbar-margin: 20px;
  --content-bottom-pad: calc(var(--tabbar-height) + var(--tabbar-margin) + 24px);
  --inputbar-height: 60px;
  --bubble-max-w: 68%;                 /* 气泡最大宽度 */

  /* 字体 */
  --font-zh: "MiSans", "PingFang SC", sans-serif;
  --font-en: "Liter", sans-serif;
  --font-display: "Cormorant Garamond", serif;
}

/* ============================================================
   本页样式: 聊天室 chat-room.html
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

button, a {
  font: inherit;
  border: none;
  background: none;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

body {
  font-family: var(--font-zh);
  background: #EAF2F8;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

/* 手机外框(移动端占满, 桌面端居中限宽) */
.phone {
  width: 100%;
  max-width: var(--phone-max-w);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;           /* 仅为背景光斑提供包含块 */
  overflow: clip;               /* clip 裁剪溢出但不建立滚动容器，sticky 子元素正常工作 */
  background: linear-gradient(135deg, var(--bg-base), var(--bg-base-end));
}

@media (min-width: 480px) {
  body { align-items: center; padding: 24px 0; }
  .phone {
    min-height: 844px;
    border-radius: 40px;
    box-shadow: 0 24px 64px rgba(94, 123, 144, 0.25);
  }
}

/* 背景光斑(纯装饰) */
.blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.blob--a { width: 430px; height: 400px; top: -110px; left: -70px;
  background: radial-gradient(circle, var(--blob-blue) 0%, transparent 70%); }
.blob--b { width: 360px; height: 340px; top: 320px; right: -110px;
  background: radial-gradient(circle, var(--blob-deep) 0%, transparent 70%); }
.blob--c { width: 320px; height: 320px; bottom: 100px; left: -60px;
  background: radial-gradient(circle, var(--blob-cyan) 0%, transparent 70%); }

/* 状态栏 */
.status-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 0;
  color: var(--icon-inactive);
}
.status-bar svg { display: block; }

/* 玻璃质感(通用类) */
.glass {
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-glass);
}

/* 头像(通用类) */
.avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-avatar);
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  color: #FFFFFF;
  flex-shrink: 0;
}
.avatar--peer { background: linear-gradient(135deg, var(--avatar-a-start), var(--avatar-a-end)); }
.avatar--mine,
.avatar--group { background: linear-gradient(135deg, var(--avatar-b-start), var(--avatar-b-end)); }
.avatar__initial { font-family: var(--font-display); line-height: 1; }

/* 顶部导航 — sticky 固定，滚动时始终置顶 */
.room-nav {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 5;
  background: linear-gradient(135deg, var(--bg-base), var(--bg-base-end));
}
.room-nav__btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand-deep);
  font-size: 16px;
  flex-shrink: 0;
}
/* title 区：头像 + 文字横排居中 */
.room-nav__title {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
/* 小头像 */
.room-nav__avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.8);
  background: linear-gradient(135deg, var(--avatar-a-start), var(--avatar-a-end));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 15px;
  flex-shrink: 0;
  overflow: hidden;
}
.room-nav__avatar img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
}
.room-nav__text {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.room-nav__name {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 21px;
  letter-spacing: 1px;
  color: var(--brand-deep);
}
.room-nav__status { font-size: 10.5px; color: var(--brand-muted); }

/* 消息流 */
.room-msgs {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;    /* 关键：让 flex 子项可以收缩，形成滚动 */
  padding: 16px var(--page-padding-x) calc(var(--inputbar-height) + var(--tabbar-margin) + 16px);
  overflow-y: auto;
}
.msg-time {
  align-self: center;
  font-family: var(--font-en);
  font-size: 10.5px;
  letter-spacing: 1px;
  color: var(--brand-muted);
}
.msg {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.msg .avatar { width: 38px; height: 38px; font-size: 16px; }
.msg__bubble {
  max-width: var(--bubble-max-w);
  padding: 12px 15px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--brand-ink);
  word-break: break-word;
}
.msg--peer .msg__bubble {
  background: var(--bubble-peer-bg);
  border-radius: var(--radius-bubble-peer);
}
.msg--mine { flex-direction: row-reverse; }
.msg--mine .msg__bubble {
  background: var(--bubble-mine-bg);
  border-radius: var(--radius-bubble-mine);
}

/* 底部输入栏 */
.inputbar {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tabbar-margin));
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - var(--page-padding-x) * 2 - 8px);
  max-width: calc(var(--phone-max-w) - var(--page-padding-x) * 2 - 8px);
  height: var(--inputbar-height);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  border-radius: 30px;
  z-index: 10;
}
.inputbar__action { color: var(--icon-tint); font-size: 18px; flex-shrink: 0; }
.inputbar__field {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--font-zh);
  font-size: 14px;
  color: var(--brand-ink);
}
.inputbar__field::placeholder { color: var(--brand-muted); }

/* 导航上下文：列表进入聊天室时不显示 Tab 栏；底部 Chat 入口进入时显示 Tab 栏。 */
.room-tabbar {
  display: none;
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tabbar-margin));
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - var(--page-padding-x) * 2);
  max-width: calc(var(--phone-max-w) - var(--page-padding-x) * 2);
  height: var(--tabbar-height);
  align-items: center;
  justify-content: space-evenly;
  border-radius: var(--radius-tabbar);
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-tabbar);
  z-index: 10;
}
.room-tabbar .tabbar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--icon-inactive);
  text-decoration: none;
  cursor: pointer;
}
.room-tabbar .tabbar__item i { font-size: 19px; }
.room-tabbar .tabbar__item span {
  font-family: var(--font-en);
  font-size: 10px;
  letter-spacing: 1px;
}
.room-tabbar .tabbar__item--active { color: var(--brand-blue); }
.phone.is-tab-mode .room-tabbar { display: flex; }
.phone.is-tab-mode .room-nav__btn.is-context-hidden {
  visibility: hidden;
  pointer-events: none;
}
.phone.is-tab-mode .inputbar {
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tabbar-margin) + var(--tabbar-height) + 12px);
}
.phone.is-tab-mode .room-msgs {
  /* tab 模式：输入栏上移至 Tab 栏之上，消息区需为两者都让出空间 */
  padding-bottom: calc(var(--tabbar-height) + var(--tabbar-margin) + var(--inputbar-height) + 28px);
}

/* ── 长按消息上下文菜单 ── */
.msg-ctx-mask {
  display: none;
  position: fixed; inset: 0;
  z-index: 200;
  background: rgba(60, 90, 110, 0.18);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.msg-ctx-mask.is-open { display: block; }

.msg-ctx-menu {
  position: fixed;
  min-width: 160px;
  border-radius: 18px;
  background: rgba(253, 254, 255, 0.97);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 8px 28px rgba(143,186,217,0.30);
  overflow: hidden;
  z-index: 201;
  transform-origin: top center;
  animation: ctx-pop 0.18s cubic-bezier(0.32,0.72,0,1) both;
}
@keyframes ctx-pop {
  from { opacity: 0; transform: scale(0.88); }
  to   { opacity: 1; transform: scale(1); }
}

.msg-ctx-item {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 18px;
  font-size: 14px; font-weight: 500;
  color: var(--brand-ink);
  cursor: pointer;
  border: none; background: none; width: 100%; text-align: left;
  transition: background 0.12s;
}
.msg-ctx-item:hover  { background: rgba(156,196,228,0.10); }
.msg-ctx-item + .msg-ctx-item { border-top: 1px solid var(--divider); }
.msg-ctx-item i { font-size: 13px; color: var(--icon-tint); width: 16px; text-align: center; flex-shrink: 0; }
.msg-ctx-item--danger { color: rgba(200,80,80,0.8); }
.msg-ctx-item--danger i { color: rgba(200,80,80,0.65); }

/* 编辑气泡模式 */
.msg__bubble--editing {
  outline: 2px solid var(--brand-blue) !important;
  border-radius: 4px;
  cursor: text;
}

/* ── 心声（思维链）折叠组件 ── */
.msg-think {
  max-width: var(--bubble-max-w);
  margin-top: 5px;
}
/* peer 消息：心声在气泡同侧（左），要偏移一个头像宽度 */
.msg--peer .msg-think  { margin-left: calc(38px + 10px); }
.msg--mine .msg-think  { margin-left: auto; }

.msg-think__toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px 3px 8px;
  border-radius: 12px;
  border: none;
  background: rgba(156,196,228,0.14);
  color: var(--brand-muted);
  font-size: 11.5px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  font-family: var(--font-zh);
}
.msg-think__toggle:hover { background: rgba(156,196,228,0.24); color: var(--brand-deep); }
.msg-think__toggle i { font-size: 10px; transition: transform 0.22s; }
.msg-think__toggle.is-open i { transform: rotate(90deg); }

.msg-think__body {
  display: none;
  margin-top: 5px;
  padding: 10px 13px;
  border-radius: 12px;
  background: rgba(240,247,252,0.72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1px solid rgba(199,217,230,0.45);
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--brand-muted);
  font-style: italic;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg-think__body.is-open { display: block; }

</style>
</head>

<body>
  <div class="phone" id="screen-chatroom" data-nav-mode="list">

    <div class="blob blob--a" aria-hidden="true"></div>
    <div class="blob blob--b" aria-hidden="true"></div>
    <div class="blob blob--c" aria-hidden="true"></div>

    <header class="status-bar" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="4" y="6" width="3" height="9" rx="1"/><rect x="8" y="3" width="3" height="12" rx="1"/><rect x="12" y="0" width="3" height="15" rx="1"/></svg>
      <svg width="16" height="15" viewBox="0 0 16 15" fill="currentColor"><path d="M8 8.5a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM8 4.9c1.5 0 2.9.6 3.9 1.6l-1.4 1.4a3.6 3.6 0 0 0-5 0L4.1 6.5A5.6 5.6 0 0 1 8 4.9Zm0-4.2c2.7 0 5.2 1.1 7 2.9l-1.4 1.4a7.8 7.8 0 0 0-11.2 0L1 3.6A9.8 9.8 0 0 1 8 .7Z"/></svg>
      <svg width="22" height="15" viewBox="0 0 25 15" fill="none" stroke="currentColor"><rect x="0.5" y="1.5" width="20" height="12" rx="3.5"/><rect x="3" y="4" width="13" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 5.5v4" stroke-width="1.5" stroke-linecap="round"/></svg>
    </header>

    <!-- 聊天室导航 -->
    <header class="room-nav" id="room-nav">
      <a class="room-nav__btn" id="btn-room-back" href="chat-list.html" aria-label="返回">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </a>
      <div class="room-nav__title">
        <div class="room-nav__avatar" id="room-nav-avatar">
          <span class="avatar__initial" id="room-nav-initial">N</span>
        </div>
        <div class="room-nav__text">
          <span class="room-nav__name">Nereus</span>
          <span class="room-nav__status">在线</span>
        </div>
      </div>
      <a class="room-nav__btn" id="btn-room-more" href="chat-settings.html" aria-label="聊天设置">
        <i class="fa-solid fa-ellipsis" aria-hidden="true"></i>
      </a>
    </header>

    <!-- 聊天室专属背景层（theme.html 设置聊天背景时插入） -->
    <div id="__chatbg_layer__" style="display:none;position:absolute;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center;background-attachment:local;opacity:0.55"></div>

    <!-- 消息流（由 JS 动态渲染） -->
    <main class="room-msgs" id="room-msgs"></main>

    <!-- 输入栏 -->
    <footer class="inputbar glass" id="inputbar">
      
      <button class="inputbar__action" id="btn-input-plus" aria-label="更多功能">
        <i class="fa-solid fa-circle-plus" aria-hidden="true"></i>
      </button>
      <input class="inputbar__field" id="input-message" type="text" placeholder="说点什么…">
      <button class="inputbar__action" id="btn-input-kaomoji" aria-label="颜文字">
        <i class="fa-regular fa-face-smile" aria-hidden="true"></i>
      </button>
      <button class="inputbar__action" id="btn-input-voice" aria-label="语音">
        <i class="fa-solid fa-microphone" aria-hidden="true"></i>
      </button>
    </footer>

    <nav class="tabbar room-tabbar" id="room-tabbar" aria-label="主导航">
      <a class="tabbar__item" id="tab-home" href="home.html">
        <i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span>
      </a>
      <a class="tabbar__item tabbar__item--active" id="tab-chat">
        <i class="fa-solid fa-message" aria-hidden="true"></i><span>Chat</span>
      </a>
      <a class="tabbar__item" id="tab-settings" href="settings.html">
        <i class="fa-solid fa-gear" aria-hidden="true"></i><span>Settings</span>
      </a>
      <a class="tabbar__item" id="tab-other" href="other.html">
        <i class="fa-solid fa-grip" aria-hidden="true"></i><span>Other</span>
      </a>
    </nav>

  </div>
  <!-- 长按消息上下文菜单 -->
  <div class="msg-ctx-mask" id="msg-ctx-mask"></div>
  <div class="msg-ctx-menu" id="msg-ctx-menu" style="display:none">
    <button class="msg-ctx-item" id="ctx-edit">
      <i class="fa-solid fa-pen" aria-hidden="true"></i>编辑
    </button>
    <button class="msg-ctx-item msg-ctx-item--danger" id="ctx-delete">
      <i class="fa-solid fa-trash" aria-hidden="true"></i>删除
    </button>
    <button class="msg-ctx-item" id="ctx-regen" style="display:none">
      <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>重新生成
    </button>
  </div>

  <script type="module" src="js/chat-app.js?v=1794307283"></script>
</body>
</html>
