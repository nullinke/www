<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo · 档案</title>

<!-- 字体: Cormorant Garamond(展示标题) / Liter(英文小标) / MiSans(中文) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Liter&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css" rel="stylesheet">
<!-- 图标: Font Awesome 6 字体图标(纯 CSS, 无 JS) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   Echo · 全局设计变量(所有页面单文件内保持一致的副本)
   与 design-tokens.css 同步
   ============================================================ */
:root {
  /* 颜色 */
  --bg-base: #FDFEFF;
  --bg-base-end: #F0F7FC;
  --blob-blue: rgba(214, 233, 247, 0.55);
  --blob-deep: rgba(174, 211, 236, 0.40);
  --blob-cyan: rgba(205, 235, 240, 0.38);

  --brand-blue: #9CC4E4;
  --brand-blue-deep: #7FA8CC;
  --brand-ink: #4E6B80;
  --brand-deep: #5E7B90;
  --brand-muted: #9DB4C4;
  --line-soft: #C7D9E6;
  --divider: #E7EFF5;
  --track: #E2EDF5;
  --chevron: #C2D3DF;
  --icon-tint: #7FA8CC;
  --icon-inactive: #A9BFCE;
  --home-indicator: #D3E0EA;

  /* 头像渐变 */
  --avatar-a-start: #CFE4F4;
  --avatar-a-end: #9CC4E4;
  --avatar-b-start: #E4EEF6;
  --avatar-b-end: #B8CFE0;

  /* 聊天气泡 */
  --bubble-peer-bg: rgba(255, 255, 255, 0.62);
  --bubble-mine-bg: rgba(156, 196, 228, 0.28);
  --radius-bubble-peer: 4px 20px 20px 20px;
  --radius-bubble-mine: 20px 4px 20px 20px;

  /* 液态玻璃 */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.90);
  --glass-border-width: 1px;
  --blur-radius: 12px;
  --glass-blur: blur(var(--blur-radius)) saturate(1.4);

  /* 阴影 */
  --shadow-glass: 0 8px 20px rgba(143, 186, 217, 0.18);
  --shadow-glass-lg: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-tabbar: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-accent: 0 8px 20px rgba(143, 186, 217, 0.40);

  /* 圆角 */
  --radius-card-lg: 24px;
  --radius-card: 22px;
  --radius-field: 16px;
  --radius-group: 20px;
  --radius-pill: 22px;
  --radius-tabbar: 24px;
  --radius-chip: 13px;
  --radius-avatar: 50%;

  /* 尺寸 */
  --phone-max-w: 420px;
  --page-padding-x: 20px;
  --tabbar-height: 70px;
  --tabbar-margin: 20px;
  --content-bottom-pad: calc(var(--tabbar-height) + var(--tabbar-margin) + 24px);
  --inputbar-height: 60px;
  --bubble-max-w: 68%;

  /* 控件 */
  --slider-track-h: 4px;
  --slider-knob: 12px;
  --seg-bg: #E9F1F7;

  /* 字体 */
  --font-zh: "MiSans", "PingFang SC", sans-serif;
  --font-en: "Liter", sans-serif;
  --font-display: "Cormorant Garamond", serif;
}

/* ============================================================
   本页样式: 档案 archive.html
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

button, a {
  font: inherit;
  border: none;
  background: none;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

body {
  font-family: var(--font-zh);
  background: #EAF2F8;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

/* 手机外框(移动端占满, 桌面端居中限宽) */
.phone {
  width: 100%;
  max-width: var(--phone-max-w);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--bg-base), var(--bg-base-end));
}

@media (min-width: 480px) {
  body { align-items: center; padding: 24px 0; }
  .phone {
    min-height: 844px;
    border-radius: 40px;
    box-shadow: 0 24px 64px rgba(94, 123, 144, 0.25);
  }
}

/* 背景光斑(纯装饰) */
.blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.blob--a { width: 430px; height: 400px; top: -110px; left: -70px;
  background: radial-gradient(circle, var(--blob-blue) 0%, transparent 70%); }
.blob--b { width: 360px; height: 340px; top: 320px; right: -110px;
  background: radial-gradient(circle, var(--blob-deep) 0%, transparent 70%); }

/* 状态栏 */
.status-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 0;
  color: var(--icon-inactive);
}
.status-bar svg { display: block; }

/* 玻璃质感(通用类) */
.glass {
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-glass);
}

/* 子页导航 */
.subnav {
  display: flex;
  align-items: center;
  padding: 12px 16px;
}
.subnav__btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand-deep);
  font-size: 16px;
  flex-shrink: 0;
}
.subnav__title {
  flex: 1;
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 21px;
  letter-spacing: 1px;
  color: var(--brand-deep);
}
.subnav__spacer { width: 36px; height: 36px; flex-shrink: 0; }

/* 顶部分段切换 + 编辑 */
.toolbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 4px var(--page-padding-x) 0;
}
.toolbar__side { display: flex; justify-content: flex-end; }
.seg {
  display: flex;
  width: 150px;
  height: 34px;
  padding: 3px;
  border-radius: 17px;
  background: var(--seg-bg);
}
.seg__item {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 13px;
  font-size: 13px;
  color: var(--brand-muted);
}
.seg__item--active {
  background: #FFFFFF;
  box-shadow: 0 2px 6px rgba(143, 186, 217, 0.18);
  font-weight: 600;
  color: var(--brand-ink);
}
.edit-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: 17px;
  font-size: 12px;
  font-weight: 600;
  color: var(--brand-ink);
}
.edit-pill i { font-size: 12px; color: var(--icon-tint); }

/* 角色切换条 */
.char-switch {
  display: flex;
  gap: 10px;
  padding: 16px var(--page-padding-x) 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.char-switch::-webkit-scrollbar { display: none; }
.char-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 16px 0 6px;
  border-radius: 20px;
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--brand-muted);
}
.char-chip--active {
  background: rgba(255, 255, 255, 0.72);
  border: 1.5px solid var(--brand-blue-deep);
  box-shadow: var(--shadow-glass);
  color: var(--brand-ink);
}
.char-chip__avatar {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-avatar);
  background: linear-gradient(135deg, var(--avatar-a-start), var(--avatar-a-end));
  color: #FFFFFF;
  font-size: 12px;
  flex-shrink: 0;
}
.char-chip__avatar--b { background: linear-gradient(135deg, var(--avatar-b-start), var(--avatar-b-end)); }
.char-add {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-avatar);
  border: 1.5px dashed var(--line-soft);
  color: var(--icon-tint);
  font-size: 14px;
  flex-shrink: 0;
}

/* 页面主体 */
.archive {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 20px var(--page-padding-x) 40px;
}

/* 编号分区 */
.arc-sec { display: flex; flex-direction: column; gap: 8px; }
.arc-sec__head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 0 4px;
}
.arc-sec__no {
  font-family: var(--font-en);
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--brand-blue);
}
.arc-sec__title { font-size: 14px; font-weight: 600; color: var(--brand-ink); }
.arc-sec__en {
  font-family: var(--font-en);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--brand-muted);
}
.arc-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--radius-group);
}
.arc-card--flush { padding: 4px 16px; gap: 0; }

/* 档案字段行 */
.arc-row {
  display: flex;
  align-items: center;
  min-height: 44px;
  text-align: left;
}
.arc-row__label { width: 88px; flex-shrink: 0; font-size: 13px; color: var(--brand-muted); }
.arc-row__value { flex: 1; font-size: 14px; color: var(--brand-ink); }
.arc-row + .arc-row { border-top: 1px solid var(--divider); }

/* 性格标签 */
.tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  display: flex;
  align-items: center;
  height: 26px;
  padding: 0 12px;
  border-radius: var(--radius-chip);
  background: rgba(156, 196, 228, 0.15);
  font-size: 12px;
  color: var(--brand-ink);
}

/* 长文本 */
.arc-text { font-size: 13px; line-height: 22px; color: var(--brand-ink); }
</style>
</head>

<body>
  <div class="phone" id="screen-archive">

    <div class="blob blob--a" aria-hidden="true"></div>
    <div class="blob blob--b" aria-hidden="true"></div>

    <header class="status-bar" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="4" y="6" width="3" height="9" rx="1"/><rect x="8" y="3" width="3" height="12" rx="1"/><rect x="12" y="0" width="3" height="15" rx="1"/></svg>
      <svg width="16" height="15" viewBox="0 0 16 15" fill="currentColor"><path d="M8 8.5a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM8 4.9c1.5 0 2.9.6 3.9 1.6l-1.4 1.4a3.6 3.6 0 0 0-5 0L4.1 6.5A5.6 5.6 0 0 1 8 4.9Zm0-4.2c2.7 0 5.2 1.1 7 2.9l-1.4 1.4a7.8 7.8 0 0 0-11.2 0L1 3.6A9.8 9.8 0 0 1 8 .7Z"/></svg>
      <svg width="22" height="15" viewBox="0 0 25 15" fill="none" stroke="currentColor"><rect x="0.5" y="1.5" width="20" height="12" rx="3.5"/><rect x="3" y="4" width="13" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 5.5v4" stroke-width="1.5" stroke-linecap="round"/></svg>
    </header>

    <!-- 子页导航 -->
    <header class="subnav" id="subnav">
      <a class="subnav__btn" id="btn-back" href="other.html" aria-label="返回">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </a>
      <h1 class="subnav__title">Archive</h1>
      <div class="subnav__spacer" aria-hidden="true"></div>
    </header>

    <!-- 档案 / 记忆库 分段切换 + 编辑 -->
    <div class="toolbar">
      <div aria-hidden="true"></div>
      <nav class="seg" role="tablist" aria-label="档案与记忆库切换">
        <a class="seg__item seg__item--active" id="seg-archive" href="archive.html" role="tab" aria-selected="true">档案</a>
        <a class="seg__item" id="seg-memory" href="memory.html" role="tab" aria-selected="false">记忆库</a>
      </nav>
      <div class="toolbar__side">
        <button class="edit-pill glass" id="btn-edit" type="button">
          <i class="fa-solid fa-pen" aria-hidden="true"></i>编辑
        </button>
      </div>
    </div>

    <!-- 角色切换条(新建 / 切换) -->
    <nav class="char-switch" id="char-switch" aria-label="角色切换">
      <button class="char-chip char-chip--active" id="char-nereus" type="button">
        <span class="char-chip__avatar">N</span>Nereus
      </button>
      <button class="char-chip glass" id="char-momo" type="button">
        <span class="char-chip__avatar char-chip__avatar--b">M</span>Momo
      </button>
      <button class="char-add" id="btn-char-add" type="button" aria-label="新建档案">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
      </button>
    </nav>

    <main class="archive" id="archive-main">

      <!-- 01 基础设定 -->
      <section class="arc-sec" aria-label="基础设定">
        <div class="arc-sec__head">
          <span class="arc-sec__no">01</span>
          <h2 class="arc-sec__title">基础设定</h2>
          <span class="arc-sec__en">IDENTITY</span>
        </div>
        <div class="arc-card arc-card--flush glass" id="arc-identity">
          <div class="arc-row">
            <span class="arc-row__label">姓名/昵称</span>
            <span class="arc-row__value" id="field-name">Nereus</span>
          </div>
          <div class="arc-row">
            <span class="arc-row__label">性别</span>
            <span class="arc-row__value" id="field-gender">男</span>
          </div>
          <div class="arc-row">
            <span class="arc-row__label">年龄</span>
            <span class="arc-row__value" id="field-age">24</span>
          </div>
          <div class="arc-row">
            <span class="arc-row__label">生日</span>
            <span class="arc-row__value" id="field-birthday">3 月 14 日</span>
          </div>
        </div>
      </section>

      <!-- 02 外貌长相与气质 -->
      <section class="arc-sec" aria-label="外貌长相与气质">
        <div class="arc-sec__head">
          <span class="arc-sec__no">02</span>
          <h2 class="arc-sec__title">外貌长相与气质</h2>
          <span class="arc-sec__en">APPEARANCE</span>
        </div>
        <div class="arc-card glass" id="arc-appearance">
          <p class="arc-text" id="field-appearance">微卷的黑色短发，海蓝色的眼睛。常穿浅色衬衫，身上有淡淡的盐汽水味道。</p>
        </div>
      </section>

      <!-- 03 性格特质 -->
      <section class="arc-sec" aria-label="性格特质">
        <div class="arc-sec__head">
          <span class="arc-sec__no">03</span>
          <h2 class="arc-sec__title">性格特质</h2>
          <span class="arc-sec__en">PERSONALITY</span>
        </div>
        <div class="arc-card glass" id="arc-personality">
          <div class="tag-row" id="field-personality-tags">
            <span class="tag">安静</span>
            <span class="tag">温和</span>
            <span class="tag">念旧</span>
            <span class="tag">收集癖</span>
          </div>
          <p class="arc-text" id="field-personality">说话慢，习惯先听完再回答。开心时会哼歌，难过时会去看海。</p>
        </div>
      </section>

      <!-- 04 日常与喜好 -->
      <section class="arc-sec" aria-label="日常与喜好">
        <div class="arc-sec__head">
          <span class="arc-sec__no">04</span>
          <h2 class="arc-sec__title">日常与喜好</h2>
          <span class="arc-sec__en">HOBBIES</span>
        </div>
        <div class="arc-card glass" id="arc-hobbies">
          <p class="arc-text" id="field-hobbies">喜欢收集贝壳和晚霞的照片，讨厌太吵的地方。每周五烤一次饼干。</p>
        </div>
      </section>

    </main>
  </div>
</body>
</html>
