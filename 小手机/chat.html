<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo · 聊天</title>

<!-- 字体: Cormorant Garamond(展示标题) / Liter(英文小标) / MiSans(中文) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Liter&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css" rel="stylesheet">
<!-- 图标: Font Awesome 6 字体图标(纯 CSS, 无 JS) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   Echo · 全局设计变量(所有页面单文件内保持一致的副本)
   与 design-tokens.css 同步
   ============================================================ */
:root {
  /* 颜色 */
  --bg-base: #FDFEFF;
  --bg-base-end: #F0F7FC;
  --blob-blue: rgba(214, 233, 247, 0.55);
  --blob-deep: rgba(174, 211, 236, 0.40);
  --blob-cyan: rgba(205, 235, 240, 0.38);

  --brand-blue: #9CC4E4;
  --brand-blue-deep: #7FA8CC;
  --brand-ink: #4E6B80;
  --brand-deep: #5E7B90;
  --brand-muted: #9DB4C4;
  --line-soft: #C7D9E6;
  --divider: #E7EFF5;
  --track: #E2EDF5;
  --chevron: #C2D3DF;
  --icon-tint: #7FA8CC;
  --icon-inactive: #A9BFCE;
  --home-indicator: #D3E0EA;

  /* 头像渐变 */
  --avatar-a-start: #CFE4F4;           /* 对方头像(亮蓝) */
  --avatar-a-end: #9CC4E4;
  --avatar-b-start: #E4EEF6;           /* 我方/群聊头像(灰蓝) */
  --avatar-b-end: #B8CFE0;

  /* 聊天气泡 */
  --bubble-peer-bg: rgba(255, 255, 255, 0.62);
  --bubble-mine-bg: rgba(156, 196, 228, 0.28);
  --radius-bubble-peer: 4px 20px 20px 20px;
  --radius-bubble-mine: 20px 4px 20px 20px;

  /* 液态玻璃 */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.90);
  --glass-border-width: 1px;
  --blur-radius: 12px;
  --glass-blur: blur(var(--blur-radius)) saturate(1.4);

  /* 阴影 */
  --shadow-glass: 0 8px 20px rgba(143, 186, 217, 0.18);
  --shadow-glass-lg: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-tabbar: 0 12px 28px rgba(143, 186, 217, 0.25);

  /* 圆角 */
  --radius-card-lg: 24px;
  --radius-card: 22px;
  --radius-pill: 22px;
  --radius-tabbar: 24px;
  --radius-chip: 13px;
  --radius-avatar: 50%;

  /* 尺寸 */
  --phone-max-w: 420px;
  --page-padding-x: 20px;
  --tabbar-height: 70px;
  --tabbar-margin: 20px;
  --content-bottom-pad: calc(var(--tabbar-height) + var(--tabbar-margin) + 24px);
  --inputbar-height: 60px;
  --bubble-max-w: 68%;                 /* 气泡最大宽度 */

  /* 字体 */
  --font-zh: "MiSans", "PingFang SC", sans-serif;
  --font-en: "Liter", sans-serif;
  --font-display: "Cormorant Garamond", serif;
}

/* ============================================================
   本页样式: 会话列表 chat-list.html
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

button, a {
  font: inherit;
  border: none;
  background: none;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

body {
  font-family: var(--font-zh);
  background: #EAF2F8;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

/* 手机外框(移动端占满, 桌面端居中限宽) */
.phone {
  width: 100%;
  max-width: var(--phone-max-w);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;           /* 仅为背景光斑提供包含块 */
  overflow: hidden;
  background: linear-gradient(135deg, var(--bg-base), var(--bg-base-end));
}

@media (min-width: 480px) {
  body { align-items: center; padding: 24px 0; }
  .phone {
    min-height: 844px;
    border-radius: 40px;
    box-shadow: 0 24px 64px rgba(94, 123, 144, 0.25);
  }
}

/* 背景光斑(纯装饰) */
.blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.blob--a { width: 430px; height: 400px; top: -110px; left: -70px;
  background: radial-gradient(circle, var(--blob-blue) 0%, transparent 70%); }
.blob--b { width: 360px; height: 340px; top: 320px; right: -110px;
  background: radial-gradient(circle, var(--blob-deep) 0%, transparent 70%); }

/* 状态栏 */
.status-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 0;
  color: var(--icon-inactive);
}
.status-bar svg { display: block; }

/* 玻璃质感(通用类) */
.glass {
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-glass);
}

/* 头像(通用类) */
.avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-avatar);
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  color: #FFFFFF;
  flex-shrink: 0;
}
.avatar--peer { background: linear-gradient(135deg, var(--avatar-a-start), var(--avatar-a-end)); }
.avatar--mine,
.avatar--group { background: linear-gradient(135deg, var(--avatar-b-start), var(--avatar-b-end)); }
.avatar__initial { font-family: var(--font-display); line-height: 1; }

/* 页面主体 */
.chatlist {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 20px var(--page-padding-x) var(--content-bottom-pad);
}

/* 页首 */
.chatlist-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.chatlist-head__title {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 34px;
  letter-spacing: 2px;
  line-height: 1.25;
  color: var(--brand-deep);
}
.chatlist-head__add {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  color: var(--icon-tint);
  font-size: 15px;
}

/* 快捷入口胶囊 */
.chatlist-entries { display: flex; gap: 10px; }
.entry-pill {
  height: 44px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 600;
  color: var(--brand-ink);
}
.entry-pill i { color: var(--icon-tint); font-size: 14px; }

/* 会话列表(Mock 数据, 结构循环替换) */
.chat-items {
  display: flex;
  flex-direction: column;
  gap: 10px;
  list-style: none;
}
.chat-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-radius: var(--radius-card);
  transition: transform 0.2s ease;
}
.chat-item:hover { transform: translateY(-1px); }
.chat-item .avatar { width: 48px; height: 48px; font-size: 21px; }
.chat-item .avatar i { font-size: 19px; }
.chat-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.chat-item__name { font-size: 15px; font-weight: 600; color: var(--brand-ink); }
.chat-item__preview {
  font-size: 12.5px;
  color: var(--brand-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-item__meta { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chat-item__time { font-family: var(--font-en); font-size: 11px; color: var(--brand-muted); }
.chat-item__unread {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--brand-blue);
}

/* 底部悬浮 Tab 栏 */
.tabbar {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tabbar-margin));
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - var(--page-padding-x) * 2);
  max-width: calc(var(--phone-max-w) - var(--page-padding-x) * 2);
  height: var(--tabbar-height);
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  border-radius: var(--radius-tabbar);
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-tabbar);
  z-index: 10;
}
.tabbar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--icon-inactive);
}
.tabbar__item i { font-size: 19px; }
.tabbar__item span { font-family: var(--font-en); font-size: 10px; letter-spacing: 1px; }
.tabbar__item--active { color: var(--brand-blue); }
</style>
</head>

<body>
  <div class="phone" id="screen-chatlist">

    <div class="blob blob--a" aria-hidden="true"></div>
    <div class="blob blob--b" aria-hidden="true"></div>

    <header class="status-bar" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="4" y="6" width="3" height="9" rx="1"/><rect x="8" y="3" width="3" height="12" rx="1"/><rect x="12" y="0" width="3" height="15" rx="1"/></svg>
      <svg width="16" height="15" viewBox="0 0 16 15" fill="currentColor"><path d="M8 8.5a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM8 4.9c1.5 0 2.9.6 3.9 1.6l-1.4 1.4a3.6 3.6 0 0 0-5 0L4.1 6.5A5.6 5.6 0 0 1 8 4.9Zm0-4.2c2.7 0 5.2 1.1 7 2.9l-1.4 1.4a7.8 7.8 0 0 0-11.2 0L1 3.6A9.8 9.8 0 0 1 8 .7Z"/></svg>
      <svg width="22" height="15" viewBox="0 0 25 15" fill="none" stroke="currentColor"><rect x="0.5" y="1.5" width="20" height="12" rx="3.5"/><rect x="3" y="4" width="13" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 5.5v4" stroke-width="1.5" stroke-linecap="round"/></svg>
    </header>

    <main class="chatlist" id="chatlist-main">

      <header class="chatlist-head">
        <h1 class="chatlist-head__title">Chat</h1>
        <a class="chatlist-head__add glass" id="btn-new-chat" href="chat-create.html" aria-label="新建聊天">
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
        </a>
      </header>

      <!-- 快捷入口 -->
      <section class="chatlist-entries" aria-label="快捷入口">
        <a class="entry-pill glass" id="btn-moments" href="moments.html">
          <i class="fa-solid fa-circle-nodes" aria-hidden="true"></i>朋友圈
        </a>
        <a class="entry-pill glass" id="btn-couple-space" href="couple-space.html">
          <i class="fa-solid fa-heart" aria-hidden="true"></i>情侣空间
        </a>
      </section>

      <!-- 会话列表(Mock 数据, 循环替换; 点击跳转对应聊天室) -->
      <ul class="chat-items" id="chat-items">
        <li>
          <a class="chat-item glass" id="chat-nereus" href="chat-room.html?nav=list&conversationId=nereus">
            <div class="avatar avatar--peer"><span class="avatar__initial">N</span></div>
            <div class="chat-item__body">
              <span class="chat-item__name">Nereus</span>
              <span class="chat-item__preview">今天海边的风很轻，想到你了</span>
            </div>
            <div class="chat-item__meta">
              <span class="chat-item__time">21:47</span>
              <span class="chat-item__unread" aria-label="未读"></span>
            </div>
          </a>
        </li>
        <li>
          <a class="chat-item glass" id="chat-momo" href="chat-room.html?nav=list&conversationId=momo">
            <div class="avatar avatar--mine"><span class="avatar__initial">M</span></div>
            <div class="chat-item__body">
              <span class="chat-item__name">Momo</span>
              <span class="chat-item__preview">新买的唱片到了，周末来听</span>
            </div>
            <div class="chat-item__meta">
              <span class="chat-item__time">19:02</span>
            </div>
          </a>
        </li>
        <li>
          <a class="chat-item glass" id="chat-group" href="chat-room.html?nav=list&conversationId=group">
            <div class="avatar avatar--group"><i class="fa-solid fa-user-group" aria-hidden="true"></i></div>
            <div class="chat-item__body">
              <span class="chat-item__name">潮汐小屋</span>
              <span class="chat-item__preview">Momo：今晚一起听歌吗</span>
            </div>
            <div class="chat-item__meta">
              <span class="chat-item__time">昨天</span>
            </div>
          </a>
        </li>
      </ul>

    </main>

    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <a class="tabbar__item" id="tab-home" href="home.html"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span></a>
      <a class="tabbar__item tabbar__item--active" id="tab-chat" href="chat-room.html?nav=tab"><i class="fa-solid fa-message" aria-hidden="true"></i><span>Chat</span></a>
      <a class="tabbar__item" id="tab-settings" href="settings.html"><i class="fa-solid fa-gear" aria-hidden="true"></i><span>Settings</span></a>
      <a class="tabbar__item" id="tab-other" href="other.html"><i class="fa-solid fa-grip" aria-hidden="true"></i><span>Other</span></a>
    </nav>

  </div>
  <script type="module" src="js/chat-app.js"></script>
</body>
</html>
