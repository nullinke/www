<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo · 主页</title>

<!-- 字体: Cormorant Garamond(展示标题) / Liter(英文小标) / MiSans(中文) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Liter&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css" rel="stylesheet">
<!-- 图标: Font Awesome 6 字体图标(纯 CSS, 无 JS) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   Echo · 主页 Home
   全局变量与 design-tokens.css 保持一致
   ============================================================ */
:root {
  /* 颜色 */
  --bg-base: #FDFEFF;
  --bg-base-end: #F0F7FC;
  --blob-blue: rgba(214, 233, 247, 0.55);
  --blob-deep: rgba(174, 211, 236, 0.40);
  --blob-cyan: rgba(205, 235, 240, 0.38);

  --brand-blue: #9CC4E4;
  --brand-blue-deep: #7FA8CC;
  --brand-ink: #4E6B80;
  --brand-deep: #5E7B90;
  --brand-muted: #9DB4C4;
  --line-soft: #C7D9E6;
  --icon-tint: #7FA8CC;
  --icon-inactive: #A9BFCE;
  --home-indicator: #D3E0EA;

  /* 液态玻璃 */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.90);
  --glass-border-width: 1px;
  --blur-radius: 12px;
  --blur-radius-lg: 14px;
  --glass-blur: blur(var(--blur-radius)) saturate(1.4);
  --glass-blur-lg: blur(var(--blur-radius-lg)) saturate(1.4);

  /* 阴影 */
  --shadow-glass: 0 10px 24px rgba(143, 186, 217, 0.20);
  --shadow-tabbar: 0 12px 28px rgba(143, 186, 217, 0.25);

  /* 圆角 */
  --radius-card: 24px;
  --radius-chip: 13px;
  --radius-tabbar: 24px;

  /* 尺寸 */
  --phone-max-w: 420px;
  --page-padding-x: 20px;
  --card-height: 104px;
  --card-gap: 12px;
  --tabbar-height: 70px;
  --tabbar-margin: 20px;      /* 距底安全距离 */
  /* 为悬浮 Tab 栏预留的内容底部空间 */
  --content-bottom-pad: calc(var(--tabbar-height) + var(--tabbar-margin) + 24px);

  /* 主题化 CSS 变量（由 chat-app.js applyThemeTokens 注入，此处为默认值）*/
  --font-size-base: 15px;
  --font-color-base: #4E6B80;
  --icon-chip-size: 38px;
  --icon-chip-radius: 13px;
  --icon-font-size: 16px;

  /* 字体 */
  --font-zh: "MiSans", "PingFang SC", sans-serif;
  --font-en: "Liter", sans-serif;
  --font-display: "Cormorant Garamond", serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-zh);
  background: #F0F7FC;  /* 与 .phone 渐变终色一致，消除白屏 */
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

/* ---------- 手机外框(移动端占满, 桌面端居中限宽) ---------- */
.phone {
  width: 100%;
  max-width: var(--phone-max-w);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;           /* 仅为背景光斑提供包含块 */
  overflow: hidden;
  background: linear-gradient(135deg, var(--bg-base), var(--bg-base-end));
}

@media (min-width: 480px) {
  body { align-items: center; padding: 24px 0; }
  .phone {
    min-height: 844px;
    border-radius: 40px;
    box-shadow: 0 24px 64px rgba(94, 123, 144, 0.25);
  }
}

/* 背景光斑(纯装饰) */
.blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.blob--a { width: 430px; height: 400px; top: -110px; left: -70px;
  background: radial-gradient(circle, var(--blob-blue) 0%, transparent 70%); }
.blob--b { width: 360px; height: 340px; top: 300px; right: -110px;
  background: radial-gradient(circle, var(--blob-deep) 0%, transparent 70%); }
.blob--c { width: 320px; height: 320px; bottom: 80px; left: -60px;
  background: radial-gradient(circle, var(--blob-cyan) 0%, transparent 70%); }

/* ---------- 状态栏 ---------- */
.status-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 0;
  color: var(--icon-inactive);
}
.status-bar svg { display: block; }

/* ---------- 主页内容 ---------- */
.home {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 28px;
  padding: 20px var(--page-padding-x) var(--content-bottom-pad);
}

/* 页首: 标题 + 问候 + 轨道装饰 */
.home-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.home-head__title {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 34px;
  letter-spacing: 2px;
  line-height: 1.25;
  color: var(--brand-deep);
}
.home-head__greeting {
  margin-top: 4px;
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--brand-muted);
}
/* ---------- 功能卡片区(2 列网格) ---------- */
.feature-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--card-gap);
}

/* Mock data: 以下卡片结构重复渲染, 后续可替换为真实数据循环 */
.feature-card {
  min-height: var(--card-height);
  height: auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  padding: 14px 16px;
  border-radius: var(--radius-card);
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-glass);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.feature-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 28px rgba(143, 186, 217, 0.28);
}
.feature-card__chip {
  width: var(--icon-chip-size);
  height: var(--icon-chip-size);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--icon-chip-radius);
  background: rgba(156, 196, 228, 0.15);
  color: var(--icon-tint);
  font-size: var(--icon-font-size);
}
.feature-card__label {
  font-size: var(--font-size-base);
  font-weight: 600;
  color: var(--font-color-base);
}

/* ---------- 底部悬浮 Tab 栏 ---------- */
.tabbar {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tabbar-margin));
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - var(--page-padding-x) * 2);
  max-width: calc(var(--phone-max-w) - var(--page-padding-x) * 2);
  height: var(--tabbar-height);
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  border-radius: var(--radius-tabbar);
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur-lg);
  -webkit-backdrop-filter: var(--glass-blur-lg);
  box-shadow: var(--shadow-tabbar);
  z-index: 10;
}
.tabbar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--icon-inactive);
  text-decoration: none;
  cursor: pointer;
}
.tabbar__item i { font-size: 19px; }
.tabbar__item span {
  font-family: var(--font-en);
  font-size: 10px;
  letter-spacing: 1px;
}
.tabbar__item--active { color: var(--brand-blue); }

/* 页面进入淡入 */
.phone {
  animation: page-fade-in 1.1s ease both;
}
@keyframes page-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
</style>
</head>

<body>
  <div class="phone" id="home-screen">

    <div class="blob blob--a" aria-hidden="true"></div>
    <div class="blob blob--b" aria-hidden="true"></div>
    <div class="blob blob--c" aria-hidden="true"></div>

    <!-- 状态栏(纯展示 Mock) -->
    <header class="status-bar" id="status-bar" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="4" y="6" width="3" height="9" rx="1"/><rect x="8" y="3" width="3" height="12" rx="1"/><rect x="12" y="0" width="3" height="15" rx="1"/></svg>
      <svg width="16" height="15" viewBox="0 0 16 15" fill="currentColor"><path d="M8 8.5a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM8 4.9c1.5 0 2.9.6 3.9 1.6l-1.4 1.4a3.6 3.6 0 0 0-5 0L4.1 6.5A5.6 5.6 0 0 1 8 4.9Zm0-4.2c2.7 0 5.2 1.1 7 2.9l-1.4 1.4a7.8 7.8 0 0 0-11.2 0L1 3.6A9.8 9.8 0 0 1 8 .7Z"/></svg>
      <svg width="22" height="15" viewBox="0 0 25 15" fill="none" stroke="currentColor"><rect x="0.5" y="1.5" width="20" height="12" rx="3.5"/><rect x="3" y="4" width="13" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 5.5v4" stroke-width="1.5" stroke-linecap="round"/></svg>
    </header>

    <!-- 主页内容 -->
    <main class="home" id="home-main">

      <header class="home-head" id="home-head">
        <div>
          <h1 class="home-head__title">Echo</h1>
          <p class="home-head__greeting">今天也在等你</p>
        </div>
      </header>

      <!-- 常用功能 -->
      <section class="feature-grid" id="feature-grid" aria-label="常用功能">
        <article class="feature-card" id="btn-music">
          <div class="feature-card__chip"><i class="fa-solid fa-music" aria-hidden="true"></i></div>
          <span class="feature-card__label">音乐</span>
        </article>
        <article class="feature-card" id="btn-diary">
          <div class="feature-card__chip"><i class="fa-solid fa-book" aria-hidden="true"></i></div>
          <span class="feature-card__label">日记</span>
        </article>
        <article class="feature-card" id="btn-invite">
          <div class="feature-card__chip"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i></div>
          <span class="feature-card__label">邀约</span>
        </article>
        <article class="feature-card" id="btn-trip">
          <div class="feature-card__chip"><i class="fa-solid fa-map" aria-hidden="true"></i></div>
          <span class="feature-card__label">行程</span>
        </article>
        <article class="feature-card" id="btn-pet">
          <div class="feature-card__chip"><i class="fa-solid fa-paw" aria-hidden="true"></i></div>
          <span class="feature-card__label">宠物</span>
        </article>
        <article class="feature-card" id="btn-home-feature">
          <div class="feature-card__chip"><i class="fa-solid fa-house" aria-hidden="true"></i></div>
          <span class="feature-card__label">家园</span>
        </article>
      </section>

    </main>

    <!-- 底部悬浮导航(交互 id 已预留) -->
    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <a class="tabbar__item tabbar__item--active" id="tab-home">
        <i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span>
      </a>
      <a class="tabbar__item" id="tab-chat" href="chat-room.html?nav=tab">
        <i class="fa-solid fa-message" aria-hidden="true"></i><span>Chat</span>
      </a>
      <a class="tabbar__item" id="tab-settings" href="settings.html">
        <i class="fa-solid fa-gear" aria-hidden="true"></i><span>Settings</span>
      </a>
      <a class="tabbar__item" id="tab-other" href="other.html">
        <i class="fa-solid fa-grip" aria-hidden="true"></i><span>Other</span>
      </a>
    </nav>

  </div>
  <script type="module" src="js/chat-app.js?v=1794307283"></script>
</body>
</html>
