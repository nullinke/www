<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo · 设置</title>

<!-- 字体: Cormorant Garamond(展示标题) / Liter(英文小标) / MiSans(中文) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Liter&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css" rel="stylesheet">
<!-- 图标: Font Awesome 6 字体图标(纯 CSS, 无 JS) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   Echo · 全局设计变量(所有页面单文件内保持一致的副本)
   与 design-tokens.css 同步
   ============================================================ */
:root {
  /* 颜色 */
  --bg-base: #FDFEFF;
  --bg-base-end: #F0F7FC;
  --blob-blue: rgba(214, 233, 247, 0.55);
  --blob-deep: rgba(174, 211, 236, 0.40);
  --blob-cyan: rgba(205, 235, 240, 0.38);

  --brand-blue: #9CC4E4;
  --brand-blue-deep: #7FA8CC;
  --brand-ink: #4E6B80;
  --brand-deep: #5E7B90;
  --brand-muted: #9DB4C4;
  --line-soft: #C7D9E6;
  --divider: #E7EFF5;
  --track: #E2EDF5;
  --chevron: #C2D3DF;
  --icon-tint: #7FA8CC;
  --icon-inactive: #A9BFCE;
  --home-indicator: #D3E0EA;
  --success-dot: #8FD0A8;

  /* 头像渐变 */
  --avatar-a-start: #CFE4F4;
  --avatar-a-end: #9CC4E4;
  --avatar-b-start: #E4EEF6;
  --avatar-b-end: #B8CFE0;

  /* 聊天气泡 */
  --bubble-peer-bg: rgba(255, 255, 255, 0.62);
  --bubble-mine-bg: rgba(156, 196, 228, 0.28);
  --radius-bubble-peer: 4px 20px 20px 20px;
  --radius-bubble-mine: 20px 4px 20px 20px;

  /* 液态玻璃 */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.90);
  --glass-border-width: 1px;
  --blur-radius: 12px;
  --glass-blur: blur(var(--blur-radius)) saturate(1.4);

  /* 阴影 */
  --shadow-glass: 0 8px 20px rgba(143, 186, 217, 0.18);
  --shadow-glass-lg: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-tabbar: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-accent: 0 8px 20px rgba(143, 186, 217, 0.40);
  --shadow-knob: 0 2px 4px rgba(94, 123, 144, 0.20);

  /* 圆角 */
  --radius-card-lg: 24px;
  --radius-card: 22px;
  --radius-field: 16px;
  --radius-group: 20px;
  --radius-pill: 22px;
  --radius-tabbar: 24px;
  --radius-chip: 13px;
  --radius-avatar: 50%;

  /* 尺寸 */
  --phone-max-w: 420px;
  --page-padding-x: 20px;
  --tabbar-height: 70px;
  --tabbar-margin: 20px;
  --content-bottom-pad: calc(var(--tabbar-height) + var(--tabbar-margin) + 24px);
  --inputbar-height: 60px;
  --bubble-max-w: 68%;

  /* 控件 */
  --switch-w: 44px;
  --switch-h: 26px;
  --switch-knob: 20px;
  --slider-track-h: 4px;
  --slider-knob: 12px;

  /* 字体 */
  --font-zh: "MiSans", "PingFang SC", sans-serif;
  --font-en: "Liter", sans-serif;
  --font-display: "Cormorant Garamond", serif;
}

/* ============================================================
   本页样式: 设置 settings.html
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

button, a {
  font: inherit;
  border: none;
  background: none;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

body {
  font-family: var(--font-zh);
  background: #EAF2F8;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

/* 手机外框(移动端占满, 桌面端居中限宽) */
.phone {
  width: 100%;
  max-width: var(--phone-max-w);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--bg-base), var(--bg-base-end));
}

@media (min-width: 480px) {
  body { align-items: center; padding: 24px 0; }
  .phone {
    min-height: 844px;
    border-radius: 40px;
    box-shadow: 0 24px 64px rgba(94, 123, 144, 0.25);
  }
}

/* 背景光斑(纯装饰) */
.blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.blob--a { width: 430px; height: 400px; top: -110px; left: -70px;
  background: radial-gradient(circle, var(--blob-blue) 0%, transparent 70%); }
.blob--b { width: 360px; height: 340px; top: 320px; right: -110px;
  background: radial-gradient(circle, var(--blob-deep) 0%, transparent 70%); }

/* 状态栏 */
.status-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 0;
  color: var(--icon-inactive);
}
.status-bar svg { display: block; }

/* 玻璃质感(通用类) */
.glass {
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-glass);
}

/* 子页导航 */
.subnav {
  display: flex;
  align-items: center;
  padding: 12px 16px;
}
.subnav__btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand-deep);
  font-size: 16px;
  flex-shrink: 0;
}
.subnav__title {
  flex: 1;
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 21px;
  letter-spacing: 1px;
  color: var(--brand-deep);
}
.subnav__spacer { width: 36px; height: 36px; flex-shrink: 0; }

/* 页面主体 */
.settings {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 8px var(--page-padding-x) var(--content-bottom-pad);
}

/* 分区 */
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec__title {
  font-family: var(--font-en);
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--brand-muted);
}
.sec__card {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-group);
  overflow: hidden;
}
.sec__card--padded { padding: 16px; gap: 14px; }

/* 列表行 */
.set-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 0 16px;
  text-align: left;
}
.set-row + .set-row { border-top: 1px solid var(--divider); }
.set-row__label { flex: 1; font-size: 13.5px; color: var(--brand-ink); }
.set-row__value { font-family: var(--font-en); font-size: 12.5px; color: var(--brand-muted); }
.set-row__arrow { color: var(--chevron); font-size: 12px; flex-shrink: 0; }

/* 滑杆行 */
.slider-row { display: flex; flex-direction: column; gap: 10px; }
.slider-row__head { display: flex; align-items: center; }
.slider-row__label { flex: 1; font-size: 13px; color: var(--brand-ink); }
.slider-row__value { font-family: var(--font-en); font-size: 12.5px; color: var(--brand-muted); }

/* 原生 range 滑块 */
.slider-range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 28px;
  background: transparent;
  cursor: pointer; touch-action: none;
  margin: 0; padding: 0;
}
.slider-range::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px; background: var(--track);
}
.slider-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; border: 2.5px solid var(--brand-blue);
  box-shadow: var(--shadow-knob); margin-top: -8px; cursor: grab;
}
.slider-range::-moz-range-track {
  height: 4px; border-radius: 2px; background: var(--track);
}
.slider-range::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; border: 2.5px solid var(--brand-blue);
}

/* 开关 */
.switch {
  width: var(--switch-w);
  height: var(--switch-h);
  border-radius: 13px;
  background: var(--track);
  position: relative;           /* 仅约束圆钮 */
  flex-shrink: 0;
  transition: background 0.2s ease;
}
.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: var(--switch-knob);
  height: var(--switch-knob);
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: var(--shadow-knob);
  transition: left 0.2s ease;
}
.switch--on { background: var(--brand-blue); }
.switch--on::after { left: calc(100% - var(--switch-knob) - 3px); }

/* 已连接服务 */
.service-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--success-dot);
  flex-shrink: 0;
}

/* 底部悬浮 Tab 栏 */
.tabbar {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tabbar-margin));
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - var(--page-padding-x) * 2);
  max-width: calc(var(--phone-max-w) - var(--page-padding-x) * 2);
  height: var(--tabbar-height);
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  border-radius: var(--radius-tabbar);
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-tabbar);
  z-index: 10;
}
.tabbar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--icon-inactive);
}
.tabbar__item i { font-size: 19px; }
.tabbar__item span { font-family: var(--font-en); font-size: 10px; letter-spacing: 1px; }
.tabbar__item--active { color: var(--brand-blue); }

/* ── 模型编辑弹层 ── */
.model-mask {
  display: none;
  position: fixed; inset: 0;
  background: rgba(78,107,128,0.22);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.model-mask.is-open { display: flex; }
.model-sheet {
  width: 100%; max-width: var(--phone-max-w);
  border-radius: 28px 28px 0 0;
  background: rgba(253,254,255,0.97);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-top: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 -8px 32px rgba(143,186,217,0.22);
  padding: 0 0 calc(env(safe-area-inset-bottom,0px) + 28px);
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
  max-height: 88dvh;
  overflow-y: auto;
}
.model-mask.is-open .model-sheet { transform: translateY(0); }
.model-sheet__handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--line-soft); margin: 12px auto 16px;
}
.model-sheet__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 14px; border-bottom: 1px solid var(--divider);
}
.model-sheet__title {
  font-family: var(--font-display); font-style: italic;
  font-size: 18px; letter-spacing: 1px; color: var(--brand-deep);
}
.model-sheet__close {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(199,217,230,0.25);
  color: var(--brand-muted); font-size: 13px; border: none; cursor: pointer;
}
.model-sheet__body { padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px; }
.model-sheet__label {
  font-size: 11px; letter-spacing: 3px; font-family: var(--font-en);
  color: var(--brand-muted); padding: 0 4px;
}
.model-sheet__input {
  display: flex; align-items: center; gap: 10px;
  height: 52px; padding: 0 16px;
  border-radius: 16px;
  background: rgba(255,255,255,0.6);
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 2px 8px rgba(143,186,217,0.08);
}
.model-sheet__input input {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: var(--font-zh); font-size: 14px; color: var(--brand-ink);
}
.model-sheet__input input::placeholder { color: var(--brand-muted); }
.model-sheet__input-icon { color: var(--icon-tint); font-size: 14px; flex-shrink: 0; }
.model-sheet__presets {
  display: flex; flex-direction: column; gap: 0;
  border-radius: 16px; overflow: hidden;
  background: rgba(255,255,255,0.5);
  border: 1px solid rgba(255,255,255,0.9);
}
.model-preset-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px;
  border: none; background: none; cursor: pointer;
  text-align: left; transition: background 0.15s;
}
.model-preset-btn:hover { background: rgba(156,196,228,0.08); }
.model-preset-btn + .model-preset-btn { border-top: 1px solid var(--divider); }
.model-preset-btn__name { flex: 1; font-size: 13.5px; color: var(--brand-ink); }
.model-preset-btn__tag {
  font-size: 10.5px; color: var(--brand-muted);
  font-family: var(--font-en); letter-spacing: 0.5px;
}
.model-sheet__save {
  height: 50px; border-radius: 25px;
  background: linear-gradient(0deg, var(--brand-blue), var(--brand-blue-deep));
  box-shadow: 0 8px 20px rgba(143,186,217,0.38);
  font-size: 15px; font-weight: 600; color: #fff;
  border: none; cursor: pointer; transition: opacity 0.15s;
  margin-top: 4px;
}
.model-sheet__save:active { opacity: 0.85; }

/* MCP 连接状态 */
.service-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--track); flex-shrink: 0; transition: background 0.3s; }
.service-dot--on  { background: var(--success-dot); }
.service-dot--off { background: #C2D3DF; }
.service-dot--err { background: rgba(200,80,80,0.6); }

/* ── 内嵌颜色面板弹层（玻璃风格，与整体 UI 一致） ── */
.color-mask {
  display: none;
  position: fixed; inset: 0;
  background: rgba(78,107,128,0.22);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 120;
  align-items: flex-end;
  justify-content: center;
}
.color-mask.is-open { display: flex; }
.color-sheet {
  width: 100%; max-width: var(--phone-max-w);
  border-radius: 28px 28px 0 0;
  background: rgba(253,254,255,0.97);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-top: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 -8px 32px rgba(143,186,217,0.22);
  padding: 0 0 calc(env(safe-area-inset-bottom,0px) + 28px);
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
}
.color-mask.is-open .color-sheet { transform: translateY(0); }
.color-sheet__handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--line-soft); margin: 12px auto 16px;
}
.color-sheet__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 14px; border-bottom: 1px solid var(--divider);
}
.color-sheet__title {
  font-family: var(--font-display); font-style: italic;
  font-size: 18px; letter-spacing: 1px; color: var(--brand-deep);
}
.color-sheet__close {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(199,217,230,0.25);
  color: var(--brand-muted); font-size: 13px; border: none; cursor: pointer;
}
.color-sheet__body { padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px; }

/* 预设色块网格 */
.color-presets {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}
.color-swatch {
  aspect-ratio: 1;
  border-radius: 12px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.15s, border-color 0.15s;
  position: relative;
}
.color-swatch:hover { transform: scale(1.08); }
.color-swatch.is-active {
  border-color: var(--brand-blue-deep);
  box-shadow: 0 0 0 2px rgba(156,196,228,0.4);
}
.color-swatch.is-active::after {
  content: '\f00c';
  font-family: 'Font Awesome 6 Free'; font-weight: 900;
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: rgba(255,255,255,0.9);
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}

/* 当前颜色预览 + 自定义输入行 */
.color-custom-row {
  display: flex; align-items: center; gap: 12px;
}
.color-custom-preview {
  width: 44px; height: 44px;
  border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,0.9);
  box-shadow: 0 2px 8px rgba(143,186,217,0.2);
  flex-shrink: 0;
}
.color-custom-input-wrap {
  flex: 1;
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 14px;
  border-radius: 14px;
  background: rgba(255,255,255,0.6);
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 2px 8px rgba(143,186,217,0.08);
}
.color-custom-input-wrap span { font-size: 13px; color: var(--brand-muted); }
.color-custom-input {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: var(--font-en); font-size: 14px; color: var(--brand-ink);
  letter-spacing: 1px; text-transform: uppercase;
}
.color-custom-input::placeholder { color: var(--brand-muted); }
.color-sheet__apply {
  height: 50px; border-radius: 25px;
  background: linear-gradient(0deg, var(--brand-blue), var(--brand-blue-deep));
  box-shadow: 0 8px 20px rgba(143,186,217,0.38);
  font-size: 15px; font-weight: 600; color: #fff;
  border: none; cursor: pointer; transition: opacity 0.15s;
}
.color-sheet__apply:active { opacity: 0.85; }
.model-sheet__eye {
  width: 28px; height: 28px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; cursor: pointer;
  color: var(--brand-muted); font-size: 13px;
  border-radius: 6px; transition: color 0.15s;
}
.model-sheet__eye:hover { color: var(--icon-tint); }

/* 拉取模型列表行 */
.model-fetch-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.model-fetch-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 14px;
  border-radius: 15px;
  background: rgba(156,196,228,0.18);
  border: 1px solid rgba(156,196,228,0.4);
  color: var(--brand-ink);
  font-size: 12px;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.15s;
}
.model-fetch-btn:disabled { opacity: 0.5; cursor: default; }
.model-fetch-btn i { color: var(--icon-tint); font-size: 11px; }
.model-fetch-btn i.spinning {
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<body>
  <div class="phone" id="screen-settings">

    <div class="blob blob--a" aria-hidden="true"></div>
    <div class="blob blob--b" aria-hidden="true"></div>

    <header class="status-bar" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="4" y="6" width="3" height="9" rx="1"/><rect x="8" y="3" width="3" height="12" rx="1"/><rect x="12" y="0" width="3" height="15" rx="1"/></svg>
      <svg width="16" height="15" viewBox="0 0 16 15" fill="currentColor"><path d="M8 8.5a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM8 4.9c1.5 0 2.9.6 3.9 1.6l-1.4 1.4a3.6 3.6 0 0 0-5 0L4.1 6.5A5.6 5.6 0 0 1 8 4.9Zm0-4.2c2.7 0 5.2 1.1 7 2.9l-1.4 1.4a7.8 7.8 0 0 0-11.2 0L1 3.6A9.8 9.8 0 0 1 8 .7Z"/></svg>
      <svg width="22" height="15" viewBox="0 0 25 15" fill="none" stroke="currentColor"><rect x="0.5" y="1.5" width="20" height="12" rx="3.5"/><rect x="3" y="4" width="13" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 5.5v4" stroke-width="1.5" stroke-linecap="round"/></svg>
    </header>

    <!-- 子页导航 -->
    <header class="subnav" id="subnav">
      <!-- 返回键：从卡片进入时显示，Tab 进入时隐藏 -->
      <a class="subnav__btn" id="btn-settings-back" href="other.html"
         aria-label="返回" style="display:none">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </a>
      <div class="subnav__spacer" id="settings-spacer-left" aria-hidden="true"></div>
      <h1 class="subnav__title">Settings</h1>
      <div class="subnav__spacer" aria-hidden="true"></div>
    </header>

    <main class="settings" id="settings-main">

      <!-- 模型 -->
      <section class="sec" id="sec-model" aria-label="模型">
        <h2 class="sec__title">模型&nbsp;&nbsp;MODEL</h2>
        <div class="sec__card glass">
          <button class="set-row" id="row-text-model">
            <span class="set-row__label">文字模型</span>
            <span class="set-row__value">Kimi K2</span>
            <i class="fa-solid fa-chevron-right set-row__arrow" aria-hidden="true"></i>
          </button>
          <button class="set-row" id="row-voice-model">
            <span class="set-row__label">语音模型</span>
            <span class="set-row__value">Echo Voice</span>
            <i class="fa-solid fa-chevron-right set-row__arrow" aria-hidden="true"></i>
          </button>
          <button class="set-row" id="row-image-model">
            <span class="set-row__label">生图模型</span>
            <span class="set-row__value">Tide Diffusion</span>
            <i class="fa-solid fa-chevron-right set-row__arrow" aria-hidden="true"></i>
          </button>
        </div>
      </section>

      <!-- 生成参数 -->
      <section class="sec" id="sec-params" aria-label="生成参数">
        <h2 class="sec__title">生成参数&nbsp;&nbsp;PARAMS</h2>
        <div class="sec__card sec__card--padded glass">

          <div class="slider-row" id="param-temp">
            <div class="slider-row__head">
              <span class="slider-row__label">温度</span>
              <span class="slider-row__value" id="val-temp">0.8</span>
            </div>
            <input class="slider-range" id="range-temp" type="range" min="0" max="1.3" step="0.1" value="0.8">
          </div>

          <div class="slider-row" id="param-topp">
            <div class="slider-row__head">
              <span class="slider-row__label">Top P</span>
              <span class="slider-row__value" id="val-topp">0.9</span>
            </div>
            <input class="slider-range" id="range-topp" type="range" min="0" max="1.25" step="0.01" value="0.9">
          </div>

          <div class="slider-row" id="param-ctx">
            <div class="slider-row__head">
              <span class="slider-row__label">上下文长度</span>
              <span class="slider-row__value" id="val-ctx">32k</span>
            </div>
            <input class="slider-range" id="range-ctx" type="range" min="8" max="68" step="8" value="32">
          </div>

          <div class="slider-row" id="param-freq">
            <div class="slider-row__head">
              <span class="slider-row__label">频率惩罚</span>
              <span class="slider-row__value" id="val-freq">0.3</span>
            </div>
            <input class="slider-range" id="range-freq" type="range" min="0" max="1.2" step="0.1" value="0.3">
          </div>

          <div class="slider-row" id="param-pres">
            <div class="slider-row__head">
              <span class="slider-row__label">存在惩罚</span>
              <span class="slider-row__value" id="val-pres">0.2</span>
            </div>
            <input class="slider-range" id="range-pres" type="range" min="0" max="1.1" step="0.1" value="0.2">
          </div>

          <div class="set-row" id="row-timeout" style="padding:0; border-top:1px solid var(--divider); min-height:40px">
            <span class="set-row__label">请求超时</span>
            <span class="set-row__value" id="val-timeout">60s</span>
          </div>

        </div>
      </section>

      <!-- 连接 -->
      <section class="sec" id="sec-connect" aria-label="连接">
        <h2 class="sec__title">连接&nbsp;&nbsp;CONNECT</h2>
        <div class="sec__card glass">
          <div class="set-row" id="row-mcp">
            <span class="set-row__label">连接 MCP</span>
            <button class="switch" id="switch-mcp" role="switch" aria-checked="false" aria-label="连接 MCP"></button>
          </div>
          <div class="set-row" id="row-service">
            <span class="service-dot service-dot--off" id="mcp-status-dot" aria-hidden="true"></span>
            <span class="set-row__label" id="mcp-status-label">未连接</span>
            <span class="set-row__value" id="mcp-status-value" style="font-family:var(--font-zh);font-size:12px"></span>
          </div>
        </div>
      </section>

    </main>

    
    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <a class="tabbar__item" id="tab-home" href="home.html"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span></a>
      <a class="tabbar__item" id="tab-chat" href="chat-room.html?nav=tab"><i class="fa-solid fa-message" aria-hidden="true"></i><span>Chat</span></a>
      <a class="tabbar__item tabbar__item--active" id="tab-settings"><i class="fa-solid fa-gear" aria-hidden="true"></i><span>Settings</span></a>
      <a class="tabbar__item" id="tab-other" href="other.html"><i class="fa-solid fa-grip" aria-hidden="true"></i><span>Other</span></a>
    </nav>

  </div>

  <!-- 模型 API 配置弹层 -->
  <div class="model-mask" id="model-mask" role="dialog" aria-modal="true" aria-label="模型 API 配置">
    <div class="model-sheet" id="model-sheet">
      <div class="model-sheet__handle" aria-hidden="true"></div>
      <div class="model-sheet__head">
        <span class="model-sheet__title" id="model-sheet-title">Text Model</span>
        <button class="model-sheet__close" id="model-sheet-close" aria-label="关闭">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="model-sheet__body">

        <!-- Base URL -->
        <p class="model-sheet__label">接口地址&nbsp;&nbsp;BASE URL</p>
        <div class="model-sheet__input">
          <i class="fa-solid fa-link model-sheet__input-icon" aria-hidden="true"></i>
          <input id="model-input-url" type="url" placeholder="https://api.example.com/v1" autocomplete="off">
        </div>

        <!-- API Key -->
        <p class="model-sheet__label">密钥&nbsp;&nbsp;API KEY</p>
        <div class="model-sheet__input">
          <i class="fa-solid fa-key model-sheet__input-icon" aria-hidden="true"></i>
          <input id="model-input-key" type="password" placeholder="sk-…" autocomplete="new-password">
          <button class="model-sheet__eye" id="model-key-toggle" aria-label="显示/隐藏密钥" type="button">
            <i class="fa-regular fa-eye" aria-hidden="true"></i>
          </button>
        </div>

        <!-- 模型名 -->
        <p class="model-sheet__label">模型名称&nbsp;&nbsp;MODEL NAME</p>
        <div class="model-sheet__input">
          <i class="fa-solid fa-microchip model-sheet__input-icon" aria-hidden="true"></i>
          <input id="model-input-name" type="text" placeholder="输入模型 ID 或名称" autocomplete="off">
        </div>

        <!-- 可用模型（拉取 + 预设） -->
        <div class="model-fetch-row">
          <p class="model-sheet__label" id="preset-label" style="flex:1;margin:0">可用模型&nbsp;&nbsp;MODELS</p>
          <button class="model-fetch-btn" id="model-fetch-btn" type="button">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i>
            <span id="model-fetch-text">拉取列表</span>
          </button>
        </div>
        <div class="model-sheet__presets" id="model-sheet-presets">
          <!-- 由 JS 生成 -->
        </div>

        <button class="model-sheet__save" id="model-sheet-save">保存</button>
      </div>
    </div>
  </div>

  <!-- 颜色选择弹层（玻璃风格，替代系统原生 color picker） -->
  <div class="color-mask" id="color-mask" role="dialog" aria-modal="true" aria-label="选择颜色">
    <div class="color-sheet" id="color-sheet">
      <div class="color-sheet__handle" aria-hidden="true"></div>
      <div class="color-sheet__head">
        <span class="color-sheet__title">Font Color</span>
        <button class="color-sheet__close" id="color-sheet-close" aria-label="关闭">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="color-sheet__body">
        <!-- 预设色块 5×2 -->
        <div class="color-presets" id="color-presets" role="radiogroup" aria-label="预设颜色">
          <!-- 由 JS 渲染 -->
        </div>
        <!-- 自定义 hex 输入 -->
        <div class="color-custom-row">
          <div class="color-custom-preview" id="color-custom-preview"></div>
          <div class="color-custom-input-wrap">
            <span>#</span>
            <input class="color-custom-input" id="color-custom-input" type="text" maxlength="6" placeholder="4E6B80" inputmode="text">
          </div>
        </div>
        <button class="color-sheet__apply" id="color-sheet-apply">应用</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/chat-app.js?v=1794307283"></script>
</body>
</html>
