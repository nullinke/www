<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo · 美化</title>

<!-- 字体: Cormorant Garamond(展示标题) / Liter(英文小标) / MiSans(中文) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Liter&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css" rel="stylesheet">
<!-- 图标: Font Awesome 6 字体图标(纯 CSS, 无 JS) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   Echo · 全局设计变量(所有页面单文件内保持一致的副本)
   与 design-tokens.css 同步
   ============================================================ */
:root {
  /* 颜色 */
  --bg-base: #FDFEFF;
  --bg-base-end: #F0F7FC;
  --blob-blue: rgba(214, 233, 247, 0.55);
  --blob-deep: rgba(174, 211, 236, 0.40);
  --blob-cyan: rgba(205, 235, 240, 0.38);

  --brand-blue: #9CC4E4;
  --brand-blue-deep: #7FA8CC;
  --brand-ink: #4E6B80;
  --brand-deep: #5E7B90;
  --brand-muted: #9DB4C4;
  --line-soft: #C7D9E6;
  --divider: #E7EFF5;
  --track: #E2EDF5;
  --chevron: #C2D3DF;
  --icon-tint: #7FA8CC;
  --icon-inactive: #A9BFCE;
  --home-indicator: #D3E0EA;

  /* 头像渐变 */
  --avatar-a-start: #CFE4F4;
  --avatar-a-end: #9CC4E4;
  --avatar-b-start: #E4EEF6;
  --avatar-b-end: #B8CFE0;

  /* 聊天气泡 */
  --bubble-peer-bg: rgba(255, 255, 255, 0.62);
  --bubble-mine-bg: rgba(156, 196, 228, 0.28);
  --radius-bubble-peer: 4px 20px 20px 20px;
  --radius-bubble-mine: 20px 4px 20px 20px;

  /* 液态玻璃 */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.90);
  --glass-border-width: 1px;
  --blur-radius: 12px;
  --glass-blur: blur(var(--blur-radius)) saturate(1.4);

  /* 阴影 */
  --shadow-glass: 0 8px 20px rgba(143, 186, 217, 0.18);
  --shadow-glass-lg: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-tabbar: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-accent: 0 8px 20px rgba(143, 186, 217, 0.40);

  /* 圆角 */
  --radius-card-lg: 24px;
  --radius-card: 22px;
  --radius-field: 16px;
  --radius-group: 20px;
  --radius-pill: 22px;
  --radius-tabbar: 24px;
  --radius-chip: 13px;
  --radius-avatar: 50%;

  /* 尺寸 */
  --phone-max-w: 420px;
  --page-padding-x: 20px;
  --tabbar-height: 70px;
  --tabbar-margin: 20px;
  --content-bottom-pad: calc(var(--tabbar-height) + var(--tabbar-margin) + 24px);
  --inputbar-height: 60px;
  --bubble-max-w: 68%;

  /* 控件 */
  --slider-track-h: 4px;
  --slider-knob: 12px;
  --seg-bg: #E9F1F7;

  /* 字体 */
  --font-zh: "MiSans", "PingFang SC", sans-serif;
  --font-en: "Liter", sans-serif;
  --font-display: "Cormorant Garamond", serif;
}

/* ============================================================
   本页样式: 美化 theme.html
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

button, a {
  font: inherit;
  border: none;
  background: none;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

body {
  font-family: var(--font-zh);
  background: #EAF2F8;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

/* 手机外框(移动端占满, 桌面端居中限宽) */
.phone {
  width: 100%;
  max-width: var(--phone-max-w);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--bg-base), var(--bg-base-end));
}

@media (min-width: 480px) {
  body { align-items: center; padding: 24px 0; }
  .phone {
    min-height: 844px;
    border-radius: 40px;
    box-shadow: 0 24px 64px rgba(94, 123, 144, 0.25);
  }
}

/* 背景光斑(纯装饰) */
.blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.blob--a { width: 430px; height: 400px; top: -110px; left: -70px;
  background: radial-gradient(circle, var(--blob-blue) 0%, transparent 70%); }
.blob--b { width: 360px; height: 340px; top: 320px; right: -110px;
  background: radial-gradient(circle, var(--blob-deep) 0%, transparent 70%); }

/* 状态栏 */
.status-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 0;
  color: var(--icon-inactive);
}
.status-bar svg { display: block; }

/* 玻璃质感(通用类) */
.glass {
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-glass);
}

/* 子页导航 */
.subnav {
  display: flex;
  align-items: center;
  padding: 12px 16px;
}
.subnav__btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand-deep);
  font-size: 16px;
  flex-shrink: 0;
}
.subnav__title {
  flex: 1;
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 21px;
  letter-spacing: 1px;
  color: var(--brand-deep);
}
.subnav__spacer { width: 36px; height: 36px; flex-shrink: 0; }

/* 页面主体 */
.theme {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 8px var(--page-padding-x) 40px;
}

/* 分区 */
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec__title {
  font-family: var(--font-en);
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--brand-muted);
}
.sec__card {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-group);
  overflow: hidden;
}
.sec__card--padded { padding: 16px; gap: 14px; }

/* 单行卡(锁屏/壁纸) */
.row-card {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 84px;
  padding: 0 16px;
  border-radius: var(--radius-group);
  text-align: left;
}
.row-card__thumb {
  width: 52px;
  height: 64px;
  border-radius: 12px;
  background: linear-gradient(90deg, var(--bg-base), #CFE4F4);
  border: 1px solid var(--glass-border);
  flex-shrink: 0;
}
.row-card__label { flex: 1; font-size: 13.5px; color: var(--brand-ink); }
.row-card__value { font-size: 12px; color: var(--brand-muted); }
.row-card__icon { color: var(--icon-tint); font-size: 15px; flex-shrink: 0; }
.row-card__arrow { color: var(--chevron); font-size: 12px; flex-shrink: 0; }

/* 锁屏圆环头像预览 */
.ring-avatar {
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 2px solid var(--brand-blue);
  background: rgba(255, 255, 255, 0.4);
  flex-shrink: 0;
}
.ring-avatar__inner {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--avatar-a-start), var(--avatar-a-end));
  color: #FFFFFF;
  font-size: 17px;
}

/* 滑杆行 */
.slider-row { display: flex; flex-direction: column; gap: 10px; }
.slider-row__head { display: flex; align-items: center; }
.slider-row__label { flex: 1; font-size: 13px; color: var(--brand-ink); }
.slider-row__value { font-family: var(--font-en); font-size: 12.5px; color: var(--brand-muted); }

/* 原生 range input 替代手写滑杆 —— 完全可靠的触摸响应 */
.slider-range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 28px;         /* 高点击区 */
  background: transparent;
  cursor: pointer;
  touch-action: none;
  margin: 0;
  padding: 0;
}
.slider-range::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: var(--track);
}
.slider-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid var(--brand-blue);
  box-shadow: 0 2px 6px rgba(156,196,228,0.5);
  margin-top: -8px;
  cursor: grab;
}
.slider-range::-moz-range-track {
  height: 4px;
  border-radius: 2px;
  background: var(--track);
}
.slider-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid var(--brand-blue);
  cursor: grab;
}
/* 已填充部分通过 JS 动态写 background-image */

/* 形状分段切换 */
.opt-row {
  display: flex;
  align-items: center;
  min-height: 32px;
}
.opt-row__label { flex: 1; font-size: 13px; color: var(--brand-ink); }
.seg {
  display: flex;
  width: 120px;
  height: 30px;
  padding: 3px;
  border-radius: 15px;
  background: var(--seg-bg);
}
.seg__item {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  font-size: 12px;
  color: var(--brand-muted);
}
.seg__item--active {
  background: #FFFFFF;
  box-shadow: 0 2px 6px rgba(143, 186, 217, 0.18);
  font-weight: 600;
  color: var(--brand-ink);
}

/* 字体颜色 — 色盘 */
.color-picker-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.color-picker-row__label { flex: 1; font-size: 13px; color: var(--brand-ink); }
.color-picker-preview {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.9);
  box-shadow: 0 0 0 1.5px var(--line-soft);
  flex-shrink: 0;
  cursor: pointer;
  overflow: hidden;
  position: relative;
}
.color-picker-preview input[type="color"] {
  position: absolute;
  inset: -4px;
  width: calc(100% + 8px);
  height: calc(100% + 8px);
  opacity: 0;
  cursor: pointer;
  border: none;
  padding: 0;
}

/* 组内分隔 */
.group-divider { height: 1px; background: var(--divider); }

/* 组内文字行 */
.group-row {
  display: flex;
  align-items: center;
  min-height: 24px;
  text-align: left;
}
.group-row__label { flex: 1; font-size: 13px; color: var(--brand-ink); }
.group-row__value { font-size: 12px; color: var(--brand-muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-row__arrow { color: var(--chevron); font-size: 12px; flex-shrink: 0; margin-left: 4px; }

/* 自定义图标网格 */
.icon-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding-top: 2px;
}
.icon-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.icon-slot__chip {
  width: 48px; height: 48px;
  border-radius: 13px;
  background: rgba(156,196,228,0.12);
  border: 1.5px dashed var(--line-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  color: var(--icon-tint);
  overflow: hidden;
  transition: border-color 0.15s;
}
.icon-slot__chip.has-img {
  border-style: solid;
  border-color: rgba(156,196,228,0.4);
}
.icon-slot__chip img { width: 100%; height: 100%; object-fit: cover; border-radius: 11px; }
.icon-slot__name { font-size: 10.5px; color: var(--brand-muted); text-align: center; }

/* 字体上传显示 */
.font-upload-row {
  display: flex; align-items: center; gap: 10px;
}
.font-upload-row__label { flex: 1; font-size: 13px; color: var(--brand-ink); }
.font-upload-row__btn {
  height: 30px; padding: 0 14px;
  border-radius: 15px;
  background: rgba(156,196,228,0.15);
  border: 1px solid rgba(156,196,228,0.4);
  font-size: 12px; color: var(--brand-ink);
  cursor: pointer; flex-shrink: 0;
}
.font-upload-row__status { font-size: 11.5px; color: var(--brand-muted); }
/* ── 颜色弹层（复用自 settings.html，玻璃风格） ── */
.color-mask { display:none; position:fixed; inset:0; background:rgba(78,107,128,0.22); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); z-index:120; align-items:flex-end; justify-content:center; }
.color-mask.is-open { display:flex; }
.color-sheet { width:100%; max-width:var(--phone-max-w); border-radius:28px 28px 0 0; background:rgba(253,254,255,0.97); backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4); border-top:1px solid rgba(255,255,255,0.9); box-shadow:0 -8px 32px rgba(143,186,217,0.22); padding:0 0 calc(env(safe-area-inset-bottom,0px) + 28px); transform:translateY(100%); transition:transform 0.32s cubic-bezier(0.32,0.72,0,1); }
.color-mask.is-open .color-sheet { transform:translateY(0); }
.color-sheet__handle { width:36px; height:4px; border-radius:2px; background:var(--line-soft); margin:12px auto 16px; }
.color-sheet__head { display:flex; align-items:center; justify-content:space-between; padding:0 20px 14px; border-bottom:1px solid var(--divider); }
.color-sheet__title { font-family:var(--font-display); font-style:italic; font-size:18px; letter-spacing:1px; color:var(--brand-deep); }
.color-sheet__close { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(199,217,230,0.25); color:var(--brand-muted); font-size:13px; border:none; cursor:pointer; }
.color-sheet__body { padding:20px 20px 0; display:flex; flex-direction:column; gap:16px; }
.color-presets { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.color-swatch { aspect-ratio:1; border-radius:12px; cursor:pointer; border:2px solid transparent; transition:transform 0.15s,border-color 0.15s; position:relative; }
.color-swatch:hover { transform:scale(1.08); }
.color-swatch.is-active { border-color:var(--brand-blue-deep); box-shadow:0 0 0 2px rgba(156,196,228,0.4); }
.color-swatch.is-active::after { content:'\f00c'; font-family:'Font Awesome 6 Free'; font-weight:900; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:rgba(255,255,255,0.9); text-shadow:0 1px 3px rgba(0,0,0,0.3); }
.color-custom-row { display:flex; align-items:center; gap:12px; }
.color-custom-preview { width:44px; height:44px; border-radius:12px; border:1.5px solid rgba(255,255,255,0.9); box-shadow:0 2px 8px rgba(143,186,217,0.2); flex-shrink:0; }
.color-custom-input-wrap { flex:1; display:flex; align-items:center; gap:8px; height:44px; padding:0 14px; border-radius:14px; background:rgba(255,255,255,0.6); border:1px solid rgba(255,255,255,0.9); box-shadow:0 2px 8px rgba(143,186,217,0.08); }
.color-custom-input-wrap span { font-size:13px; color:var(--brand-muted); }
.color-custom-input { flex:1; border:none; outline:none; background:transparent; font-family:var(--font-en); font-size:14px; color:var(--brand-ink); letter-spacing:1px; text-transform:uppercase; }
.color-custom-input::placeholder { color:var(--brand-muted); }
.color-sheet__apply { height:50px; border-radius:25px; background:linear-gradient(0deg,var(--brand-blue),var(--brand-blue-deep)); box-shadow:0 8px 20px rgba(143,186,217,0.38); font-size:15px; font-weight:600; color:#fff; border:none; cursor:pointer; transition:opacity 0.15s; }
.color-sheet__apply:active { opacity:0.85; }
</style>
</head>

<body>
  <div class="phone" id="screen-theme">

    <div class="blob blob--a" aria-hidden="true"></div>
    <div class="blob blob--b" aria-hidden="true"></div>

    <header class="status-bar" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="4" y="6" width="3" height="9" rx="1"/><rect x="8" y="3" width="3" height="12" rx="1"/><rect x="12" y="0" width="3" height="15" rx="1"/></svg>
      <svg width="16" height="15" viewBox="0 0 16 15" fill="currentColor"><path d="M8 8.5a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM8 4.9c1.5 0 2.9.6 3.9 1.6l-1.4 1.4a3.6 3.6 0 0 0-5 0L4.1 6.5A5.6 5.6 0 0 1 8 4.9Zm0-4.2c2.7 0 5.2 1.1 7 2.9l-1.4 1.4a7.8 7.8 0 0 0-11.2 0L1 3.6A9.8 9.8 0 0 1 8 .7Z"/></svg>
      <svg width="22" height="15" viewBox="0 0 25 15" fill="none" stroke="currentColor"><rect x="0.5" y="1.5" width="20" height="12" rx="3.5"/><rect x="3" y="4" width="13" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 5.5v4" stroke-width="1.5" stroke-linecap="round"/></svg>
    </header>

    <!-- 子页导航 -->
    <header class="subnav" id="subnav">
      <a class="subnav__btn" id="btn-back" href="other.html" aria-label="返回">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </a>
      <h1 class="subnav__title">Theme</h1>
      <div class="subnav__spacer" aria-hidden="true"></div>
    </header>

    <main class="theme" id="theme-main">

      <!-- 锁屏 -->
      <section class="sec" id="sec-lock" aria-label="锁屏">
        <h2 class="sec__title">锁屏&nbsp;&nbsp;LOCKSCREEN</h2>
        <button class="row-card glass" id="btn-lock-avatar">
          <span class="ring-avatar" id="lock-avatar-ring">
            <span class="ring-avatar__inner" id="lock-avatar-inner">
              <i class="fa-solid fa-user" aria-hidden="true"></i>
            </span>
          </span>
          <span class="row-card__label">自定义圆环头像</span>
          <span class="row-card__value" id="lock-avatar-value">导入图片</span>
          <i class="fa-solid fa-chevron-right row-card__arrow" aria-hidden="true"></i>
        </button>
        <input type="file" id="lock-avatar-file" accept="image/*" style="display:none" aria-hidden="true">
      </section>

      <!-- 壁纸 -->
      <section class="sec" id="sec-wallpaper" aria-label="壁纸">
        <h2 class="sec__title">壁纸&nbsp;&nbsp;WALLPAPER</h2>
        <!-- 锁屏专属壁纸 -->
        <button class="row-card glass" id="btn-lock-wallpaper">
          <span class="row-card__thumb" id="lock-wallpaper-thumb" aria-hidden="true"></span>
          <span class="row-card__label">锁屏壁纸</span>
          <span class="row-card__value" id="lock-wallpaper-value">未设置</span>
          <i class="fa-solid fa-lock row-card__icon" aria-hidden="true" style="margin-left:4px"></i>
        </button>
        <input type="file" id="lock-wallpaper-file" accept="image/*" style="display:none" aria-hidden="true">
        <!-- 全局壁纸（除锁屏/聊天室以外） -->
        <button class="row-card glass" id="btn-wallpaper" style="margin-top:8px">
          <span class="row-card__thumb" id="wallpaper-thumb" aria-hidden="true"></span>
          <span class="row-card__label">全局壁纸</span>
          <span class="row-card__value" id="wallpaper-value">未设置</span>
          <i class="fa-regular fa-image row-card__icon" aria-hidden="true" style="margin-left:4px"></i>
        </button>
        <input type="file" id="wallpaper-file" accept="image/*" style="display:none" aria-hidden="true">
        <!-- 聊天室专属背景 -->
        <button class="row-card glass" id="btn-chat-bg" style="margin-top:8px">
          <span class="row-card__thumb" id="chat-bg-thumb" aria-hidden="true"></span>
          <span class="row-card__label">聊天背景</span>
          <span class="row-card__value" id="chat-bg-value">未设置</span>
          <i class="fa-solid fa-comment-dots row-card__icon" aria-hidden="true" style="margin-left:4px"></i>
        </button>
        <input type="file" id="chat-bg-file" accept="image/*" style="display:none" aria-hidden="true">
      </section>

      <!-- 图标 -->
      <section class="sec" id="sec-icon" aria-label="图标">
        <h2 class="sec__title">图标&nbsp;&nbsp;ICON</h2>
        <div class="sec__card sec__card--padded glass">

          <div class="slider-row" id="opt-icon-size">
            <div class="slider-row__head">
              <span class="slider-row__label">图标大小</span>
              <span class="slider-row__value" id="icon-size-label">中</span>
            </div>
            <input class="slider-range" id="range-icon-size" type="range" min="0" max="100" value="50" step="1">
          </div>

          <div class="opt-row" id="opt-icon-shape">
            <span class="opt-row__label">形状</span>
            <div class="seg" role="tablist">
              <button class="seg__item seg__item--active" id="shape-round" role="tab">圆角</button>
              <button class="seg__item" id="shape-square" role="tab">方角</button>
            </div>
          </div>

          <div class="group-divider" aria-hidden="true"></div>

          <!-- 自定义图标：每个功能卡单独上传 -->
          <div>
            <p style="font-size:11.5px;color:var(--brand-muted);margin-bottom:10px">点击图标格子单独替换图片</p>
            <div class="icon-grid" id="icon-grid">
              <!-- 由 JS 生成 -->
            </div>
          </div>

        </div>
      </section>

      <!-- 字体 -->
      <section class="sec" id="sec-font" aria-label="字体">
        <h2 class="sec__title">字体&nbsp;&nbsp;FONT</h2>
        <div class="sec__card sec__card--padded glass">

          <div class="slider-row" id="opt-font-size">
            <div class="slider-row__head">
              <span class="slider-row__label">字体大小</span>
              <span class="slider-row__value" id="font-size-label">标准</span>
            </div>
            <input class="slider-range" id="range-font-size" type="range" min="0" max="100" value="45" step="1">
          </div>

          <div class="color-picker-row" id="opt-font-color">
            <span class="color-picker-row__label">字体颜色</span>
            <span class="color-picker-preview" id="font-color-preview" style="background:#4E6B80;cursor:pointer" role="button" aria-label="选择字体颜色"></span>
          </div>

          <div class="group-divider" aria-hidden="true"></div>

          <!-- 自定义字体上传 -->
          <div class="font-upload-row">
            <span class="font-upload-row__label">自定义字体</span>
            <span class="font-upload-row__status" id="font-upload-status">未导入</span>
            <button class="font-upload-row__btn" id="btn-font-upload">选择文件</button>
            <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2" style="display:none" aria-hidden="true">
          </div>

        </div>
      </section>

    </main>

  </div>
<!-- 颜色选择弹层（玻璃风格） -->
  <div class="color-mask" id="color-mask" role="dialog" aria-modal="true" aria-label="选择字体颜色">
    <div class="color-sheet" id="color-sheet">
      <div class="color-sheet__handle" aria-hidden="true"></div>
      <div class="color-sheet__head">
        <span class="color-sheet__title">Font Color</span>
        <button class="color-sheet__close" id="color-sheet-close" aria-label="关闭">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="color-sheet__body">
        <div class="color-presets" id="color-presets" role="radiogroup" aria-label="预设颜色"></div>
        <div class="color-custom-row">
          <div class="color-custom-preview" id="color-custom-preview"></div>
          <div class="color-custom-input-wrap">
            <span>#</span>
            <input class="color-custom-input" id="color-custom-input" type="text" maxlength="6" placeholder="4E6B80" inputmode="text">
          </div>
        </div>
        <button class="color-sheet__apply" id="color-sheet-apply">应用</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/chat-app.js?v=1794307283"></script>
</body>
</html>
