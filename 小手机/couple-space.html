<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo · 情侣空间</title>

<!-- 字体: Cormorant Garamond(展示标题) / Liter(英文小标) / MiSans(中文) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Liter&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css" rel="stylesheet">
<!-- 图标: Font Awesome 6 字体图标(纯 CSS, 无 JS) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   Echo · 全局设计变量(所有页面单文件内保持一致的副本)
   与 design-tokens.css 同步
   ============================================================ */
:root {
  /* 颜色 */
  --bg-base: #FDFEFF;
  --bg-base-end: #F0F7FC;
  --blob-blue: rgba(214, 233, 247, 0.55);
  --blob-deep: rgba(174, 211, 236, 0.40);
  --blob-cyan: rgba(205, 235, 240, 0.38);

  --brand-blue: #9CC4E4;
  --brand-blue-deep: #7FA8CC;
  --brand-ink: #4E6B80;
  --brand-deep: #5E7B90;
  --brand-muted: #9DB4C4;
  --line-soft: #C7D9E6;
  --divider: #E7EFF5;
  --track: #E2EDF5;
  --chevron: #C2D3DF;
  --icon-tint: #7FA8CC;
  --icon-inactive: #A9BFCE;
  --home-indicator: #D3E0EA;

  /* 头像渐变 */
  --avatar-a-start: #CFE4F4;
  --avatar-a-end: #9CC4E4;
  --avatar-b-start: #E4EEF6;
  --avatar-b-end: #B8CFE0;

  /* 聊天气泡 */
  --bubble-peer-bg: rgba(255, 255, 255, 0.62);
  --bubble-mine-bg: rgba(156, 196, 228, 0.28);
  --radius-bubble-peer: 4px 20px 20px 20px;
  --radius-bubble-mine: 20px 4px 20px 20px;

  /* 液态玻璃 */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.90);
  --glass-border-width: 1px;
  --blur-radius: 12px;
  --glass-blur: blur(var(--blur-radius)) saturate(1.4);

  /* 阴影 */
  --shadow-glass: 0 8px 20px rgba(143, 186, 217, 0.18);
  --shadow-glass-lg: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-tabbar: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-accent: 0 8px 20px rgba(143, 186, 217, 0.40);

  /* 圆角 */
  --radius-card-lg: 24px;
  --radius-card: 22px;
  --radius-field: 16px;
  --radius-pill: 22px;
  --radius-tabbar: 24px;
  --radius-chip: 13px;
  --radius-avatar: 50%;

  /* 尺寸 */
  --phone-max-w: 420px;
  --page-padding-x: 20px;
  --tabbar-height: 70px;
  --tabbar-margin: 20px;
  --content-bottom-pad: calc(var(--tabbar-height) + var(--tabbar-margin) + 24px);
  --inputbar-height: 60px;
  --bubble-max-w: 68%;

  /* 字体 */
  --font-zh: "MiSans", "PingFang SC", sans-serif;
  --font-en: "Liter", sans-serif;
  --font-display: "Cormorant Garamond", serif;
}

/* ============================================================
   本页样式: 情侣空间 couple-space.html
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

button, a {
  font: inherit;
  border: none;
  background: none;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

body {
  font-family: var(--font-zh);
  background: #EAF2F8;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

/* 手机外框(移动端占满, 桌面端居中限宽) */
.phone {
  width: 100%;
  max-width: var(--phone-max-w);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--bg-base), var(--bg-base-end));
}

@media (min-width: 480px) {
  body { align-items: center; padding: 24px 0; }
  .phone {
    min-height: 844px;
    border-radius: 40px;
    box-shadow: 0 24px 64px rgba(94, 123, 144, 0.25);
  }
}

/* 背景光斑(纯装饰) */
.blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.blob--a { width: 430px; height: 400px; top: -110px; left: -70px;
  background: radial-gradient(circle, var(--blob-blue) 0%, transparent 70%); }
.blob--b { width: 360px; height: 340px; top: 320px; right: -110px;
  background: radial-gradient(circle, var(--blob-deep) 0%, transparent 70%); }

/* 状态栏 */
.status-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 0;
  color: var(--icon-inactive);
}
.status-bar svg { display: block; }

/* 玻璃质感(通用类) */
.glass {
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-glass);
}

/* 头像(通用类) */
.avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-avatar);
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  color: #FFFFFF;
  flex-shrink: 0;
}
.avatar--peer { background: linear-gradient(135deg, var(--avatar-a-start), var(--avatar-a-end)); }
.avatar--mine { background: linear-gradient(135deg, var(--avatar-b-start), var(--avatar-b-end)); }
.avatar__initial { font-family: var(--font-display); line-height: 1; }

/* 子页导航 */
.subnav {
  display: flex;
  align-items: center;
  padding: 12px 16px;
}
.subnav__btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand-deep);
  font-size: 16px;
  flex-shrink: 0;
}
.subnav__title {
  flex: 1;
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 21px;
  letter-spacing: 1px;
  color: var(--brand-deep);
}
.subnav__spacer { width: 36px; height: 36px; flex-shrink: 0; }

/* 页面主体 */
.couple {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 8px var(--page-padding-x) 40px;
}

/* Hero 卡 */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 28px 20px 24px;
  border-radius: var(--radius-card-lg);
}
/* 双头像(并排留距) */
.hero__avatars { display: flex; align-items: center; gap: 12px; }
.hero__avatars .avatar { width: 56px; height: 56px; font-size: 23px; border-width: 2px; }
.hero__names { font-size: 17px; font-weight: 600; color: var(--brand-ink); }
.hero__days {
  font-family: var(--font-en);
  font-size: 10.5px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--brand-muted);
}

/* 功能网格(2 列) */
.couple-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.couple-card {
  height: 96px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
  border-radius: var(--radius-card-lg);
  text-align: left;
  transition: transform 0.2s ease;
}
.couple-card:hover { transform: translateY(-1px); }
.couple-card__chip {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-chip);
  background: rgba(156, 196, 228, 0.15);
  color: var(--icon-tint);
  font-size: 16px;
}
.couple-card__label { font-size: 14px; font-weight: 600; color: var(--brand-ink); }

/* 纪念日图标: FA 免费 solid 无 calendar-heart 字形, 直接用日历图标 */

/* ── 角色头像点击区域 ── */
.char-avatar-wrap {
  position: relative;
  cursor: pointer;
  border-radius: 50%;
  flex-shrink: 0;
}
.char-avatar-wrap .avatar { width: 56px; height: 56px; font-size: 23px; border-width: 2px; }
.char-avatar-badge {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: rgba(0,0,0,0.22);
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.18s;
}
.char-avatar-wrap:hover .char-avatar-badge,
.char-avatar-wrap:active .char-avatar-badge { opacity: 1; }
.char-avatar-badge i { color: #fff; font-size: 13px; }

/* ── 角色选择弹层 ── */
.char-pick-mask {
  display: none;
  position: fixed; inset: 0;
  background: rgba(78,107,128,0.22);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.char-pick-mask.is-open { display: flex; }

.char-pick-sheet {
  width: 100%; max-width: var(--phone-max-w);
  border-radius: 28px 28px 0 0;
  background: rgba(253,254,255,0.97);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-top: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 -8px 32px rgba(143,186,217,0.22);
  padding: 0 0 calc(env(safe-area-inset-bottom,0px) + 24px);
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
  max-height: 72dvh;
  overflow-y: auto;
}
.char-pick-mask.is-open .char-pick-sheet { transform: translateY(0); }

.char-pick-sheet__handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--line-soft); margin: 12px auto 16px;
}
.char-pick-sheet__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 14px;
  border-bottom: 1px solid var(--divider);
  position: sticky; top: 0;
  background: rgba(253,254,255,0.97); z-index: 1;
}
.char-pick-sheet__title {
  font-family: var(--font-display); font-style: italic;
  font-size: 18px; letter-spacing: 1px; color: var(--brand-deep);
}
.char-pick-sheet__close {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(199,217,230,0.25);
  color: var(--brand-muted); font-size: 13px; border: none; cursor: pointer;
}
.char-pick-sheet__body { padding: 8px 20px 0; display: flex; flex-direction: column; gap: 2px; }

.char-pick-item {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 12px;
  border-radius: 16px;
  cursor: pointer; border: none; background: none;
  width: 100%; text-align: left;
  transition: background 0.15s;
}
.char-pick-item:hover { background: rgba(156,196,228,0.08); }
.char-pick-item--active { background: rgba(156,196,228,0.14); }
.char-pick-item__avatar {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.8);
  background: linear-gradient(135deg, var(--avatar-a-start), var(--avatar-a-end));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 18px; flex-shrink: 0; overflow: hidden;
}
.char-pick-item__avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.char-pick-item__body { flex: 1; min-width: 0; }
.char-pick-item__name { font-size: 14.5px; font-weight: 600; color: var(--brand-ink); }
.char-pick-item__alias { font-size: 12px; color: var(--brand-muted); margin-top: 2px; }
.char-pick-item__check { color: var(--brand-blue); font-size: 14px; flex-shrink: 0; }
</style>
</head>

<body>
  <div class="phone" id="screen-couple">

    <div class="blob blob--a" aria-hidden="true"></div>
    <div class="blob blob--b" aria-hidden="true"></div>

    <header class="status-bar" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="4" y="6" width="3" height="9" rx="1"/><rect x="8" y="3" width="3" height="12" rx="1"/><rect x="12" y="0" width="3" height="15" rx="1"/></svg>
      <svg width="16" height="15" viewBox="0 0 16 15" fill="currentColor"><path d="M8 8.5a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM8 4.9c1.5 0 2.9.6 3.9 1.6l-1.4 1.4a3.6 3.6 0 0 0-5 0L4.1 6.5A5.6 5.6 0 0 1 8 4.9Zm0-4.2c2.7 0 5.2 1.1 7 2.9l-1.4 1.4a7.8 7.8 0 0 0-11.2 0L1 3.6A9.8 9.8 0 0 1 8 .7Z"/></svg>
      <svg width="22" height="15" viewBox="0 0 25 15" fill="none" stroke="currentColor"><rect x="0.5" y="1.5" width="20" height="12" rx="3.5"/><rect x="3" y="4" width="13" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 5.5v4" stroke-width="1.5" stroke-linecap="round"/></svg>
    </header>

    <!-- 子页导航 -->
    <header class="subnav" id="subnav">
      <a class="subnav__btn" id="btn-back" href="chat-list.html" aria-label="返回">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </a>
      <h1 class="subnav__title">Our Space</h1>
      <div class="subnav__spacer" aria-hidden="true"></div>
    </header>

    <main class="couple" id="couple-main">

      <!-- Hero 卡 -->
      <section class="hero glass" id="couple-hero">
        <div class="hero__avatars">
          <!-- 角色头像：点击切换 -->
          <button class="char-avatar-wrap" id="btn-pick-char" aria-label="切换角色">
            <div class="avatar avatar--peer" id="couple-char-avatar">
              <span class="avatar__initial" id="couple-char-initial">N</span>
            </div>
            <span class="char-avatar-badge" aria-hidden="true">
              <i class="fa-solid fa-arrows-rotate"></i>
            </span>
          </button>
          <div class="avatar avatar--mine" id="couple-my-avatar">
            <span class="avatar__initial" id="couple-my-initial">我</span>
          </div>
        </div>
        <p class="hero__names" id="couple-hero-names">Nereus &amp; 拾贝人</p>
        <p class="hero__days" id="couple-hero-days">59 Days Together</p>
      </section>

      <!-- 功能网格 -->
      <section class="couple-grid" id="couple-grid" aria-label="空间功能">
        <button class="couple-card glass" id="btn-dates">
          <span class="couple-card__chip"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i></span>
          <span class="couple-card__label">纪念日</span>
        </button>
        <button class="couple-card glass" id="btn-album">
          <span class="couple-card__chip"><i class="fa-solid fa-images" aria-hidden="true"></i></span>
          <span class="couple-card__label">共享相册</span>
        </button>
        <button class="couple-card glass" id="btn-wishlist">
          <span class="couple-card__chip"><i class="fa-solid fa-star" aria-hidden="true"></i></span>
          <span class="couple-card__label">心愿单</span>
        </button>
        <button class="couple-card glass" id="btn-space-settings">
          <span class="couple-card__chip"><i class="fa-solid fa-sliders" aria-hidden="true"></i></span>
          <span class="couple-card__label">空间设置</span>
        </button>
      </section>

    </main>

  </div>

  <!-- 角色选择弹层 -->
  <div class="char-pick-mask" id="char-pick-mask" role="dialog" aria-modal="true" aria-label="选择角色">
    <div class="char-pick-sheet" id="char-pick-sheet">
      <div class="char-pick-sheet__handle" aria-hidden="true"></div>
      <div class="char-pick-sheet__head">
        <span class="char-pick-sheet__title">Choose Character</span>
        <button class="char-pick-sheet__close" id="char-pick-close" aria-label="关闭">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="char-pick-sheet__body" id="char-pick-list">
        <!-- 由 JS 生成 -->
      </div>
    </div>
  </div>

  <script type="module" src="js/chat-app.js?v=1794307283"></script>
</body>
</html>
