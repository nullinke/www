<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echo · 聊天设置</title>

<!-- 字体: Cormorant Garamond(展示标题) / Liter(英文小标) / MiSans(中文) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Liter&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css" rel="stylesheet">
<!-- 图标: Font Awesome 6 字体图标(纯 CSS, 无 JS) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   Echo · 全局设计变量(所有页面单文件内保持一致的副本)
   与 design-tokens.css 同步
   ============================================================ */
:root {
  /* 颜色 */
  --bg-base: #FDFEFF;
  --bg-base-end: #F0F7FC;
  --blob-blue: rgba(214, 233, 247, 0.55);
  --blob-deep: rgba(174, 211, 236, 0.40);
  --blob-cyan: rgba(205, 235, 240, 0.38);

  --brand-blue: #9CC4E4;
  --brand-blue-deep: #7FA8CC;
  --brand-ink: #4E6B80;
  --brand-deep: #5E7B90;
  --brand-muted: #9DB4C4;
  --line-soft: #C7D9E6;
  --divider: #E7EFF5;
  --track: #E2EDF5;
  --chevron: #C2D3DF;
  --icon-tint: #7FA8CC;
  --icon-inactive: #A9BFCE;
  --home-indicator: #D3E0EA;

  /* 头像渐变 */
  --avatar-a-start: #CFE4F4;
  --avatar-a-end: #9CC4E4;
  --avatar-b-start: #E4EEF6;
  --avatar-b-end: #B8CFE0;

  /* 聊天气泡(含可选项色板) */
  --bubble-peer-bg: rgba(255, 255, 255, 0.62);
  --bubble-mine-bg: rgba(156, 196, 228, 0.28);
  --radius-bubble-peer: 4px 20px 20px 20px;
  --radius-bubble-mine: 20px 4px 20px 20px;
  --bubble-opt-blue: rgba(156, 196, 228, 0.35);
  --bubble-opt-cyan: rgba(168, 216, 216, 0.40);
  --bubble-opt-ivory: rgba(237, 230, 216, 0.40);
  --bubble-opt-lilac: rgba(197, 190, 220, 0.40);
  --bubble-opt-rose: rgba(227, 198, 204, 0.40);

  /* 液态玻璃 */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.90);
  --glass-border-width: 1px;
  --blur-radius: 12px;
  --glass-blur: blur(var(--blur-radius)) saturate(1.4);

  /* 阴影 */
  --shadow-glass: 0 8px 20px rgba(143, 186, 217, 0.18);
  --shadow-glass-lg: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-tabbar: 0 12px 28px rgba(143, 186, 217, 0.25);
  --shadow-accent: 0 8px 20px rgba(143, 186, 217, 0.40);

  /* 圆角 */
  --radius-card-lg: 24px;
  --radius-card: 22px;
  --radius-field: 16px;
  --radius-pill: 22px;
  --radius-tabbar: 24px;
  --radius-chip: 13px;
  --radius-avatar: 50%;

  /* 尺寸 */
  --phone-max-w: 420px;
  --page-padding-x: 20px;
  --tabbar-height: 70px;
  --tabbar-margin: 20px;
  --content-bottom-pad: calc(var(--tabbar-height) + var(--tabbar-margin) + 24px);
  --inputbar-height: 60px;
  --bubble-max-w: 68%;

  /* 字体 */
  --font-zh: "MiSans", "PingFang SC", sans-serif;
  --font-en: "Liter", sans-serif;
  --font-display: "Cormorant Garamond", serif;
}

/* ============================================================
   本页样式: 聊天设置 chat-settings.html
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

button, a {
  font: inherit;
  border: none;
  background: none;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

body {
  font-family: var(--font-zh);
  background: #EAF2F8;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

/* 手机外框(移动端占满, 桌面端居中限宽) */
.phone {
  width: 100%;
  max-width: var(--phone-max-w);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--bg-base), var(--bg-base-end));
}

@media (min-width: 480px) {
  body { align-items: center; padding: 24px 0; }
  .phone {
    min-height: 844px;
    border-radius: 40px;
    box-shadow: 0 24px 64px rgba(94, 123, 144, 0.25);
  }
}

/* 背景光斑(纯装饰) */
.blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.blob--a { width: 430px; height: 400px; top: -110px; left: -70px;
  background: radial-gradient(circle, var(--blob-blue) 0%, transparent 70%); }
.blob--b { width: 360px; height: 340px; top: 320px; right: -110px;
  background: radial-gradient(circle, var(--blob-deep) 0%, transparent 70%); }

/* 状态栏 */
.status-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 0;
  color: var(--icon-inactive);
}
.status-bar svg { display: block; }

/* 玻璃质感(通用类) */
.glass {
  background: var(--glass-bg);
  border: var(--glass-border-width) solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-glass);
}

/* 头像(通用类) */
.avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-avatar);
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  color: #FFFFFF;
  flex-shrink: 0;
}
.avatar--peer { background: linear-gradient(135deg, var(--avatar-a-start), var(--avatar-a-end)); }
.avatar__initial { font-family: var(--font-display); line-height: 1; }

/* 子页导航 */
.subnav {
  display: flex;
  align-items: center;
  padding: 12px 16px;
}
.subnav__btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand-deep);
  font-size: 16px;
  flex-shrink: 0;
}
.subnav__title {
  flex: 1;
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 21px;
  letter-spacing: 1px;
  color: var(--brand-deep);
}
.subnav__spacer { width: 36px; height: 36px; flex-shrink: 0; }

/* 页面主体 */
.chatset {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 8px var(--page-padding-x) 40px;
}

/* 角色资料卡 */
.profile-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 22px 20px;
  border-radius: var(--radius-card-lg);
}
.profile-card .avatar { width: 64px; height: 64px; font-size: 26px; }
.profile-card__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.profile-card__name { font-size: 22px; font-weight: 600; color: var(--brand-ink); }
.profile-card__desc { font-size: 12px; color: var(--brand-muted); }

/* 设置行 */
.set-rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.set-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 50px;
  padding: 12px 16px;
  border-radius: var(--radius-field);
  text-align: left;
}
.set-row__label { flex: 1; font-size: 13.5px; color: var(--brand-ink); }
.set-row__value { font-size: 13px; color: var(--brand-muted); }
.set-row__arrow { color: var(--chevron); font-size: 12px; flex-shrink: 0; }

/* 气泡颜色卡 */
.bubble-card {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 96px;
  padding: 16px;
  border-radius: var(--radius-field);
}
.bubble-card__label { flex: 1; font-size: 13.5px; color: var(--brand-ink); }
.bubble-card__dots { display: flex; gap: 10px; }
.bubble-dot {
  position: relative;
  width: 32px;
  height: 32px;
  border-radius: 50%;
}
.bubble-dot--blue  { background: var(--bubble-opt-blue); }
.bubble-dot--cyan  { background: var(--bubble-opt-cyan); }
.bubble-dot--ivory { background: var(--bubble-opt-ivory); }
.bubble-dot--lilac { background: var(--bubble-opt-lilac); }
.bubble-dot--rose  { background: var(--bubble-opt-rose); }
.bubble-dot--active::after {
  content: "\f00c";                /* FA check */
  font-family: "Font Awesome 6 Free";
  font-weight: 900;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--brand-deep);
}

/* 朋友圈 / 情侣空间 双入口 */
.chatset-entries {
  display: flex;
  gap: 10px;
}
.entry-card {
  flex: 1;
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 20px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--brand-ink);
}
.entry-card i { color: var(--icon-tint); font-size: 16px; }
</style>
</head>

<body>
  <div class="phone" id="screen-chatset">

    <div class="blob blob--a" aria-hidden="true"></div>
    <div class="blob blob--b" aria-hidden="true"></div>

    <header class="status-bar" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="4" y="6" width="3" height="9" rx="1"/><rect x="8" y="3" width="3" height="12" rx="1"/><rect x="12" y="0" width="3" height="15" rx="1"/></svg>
      <svg width="16" height="15" viewBox="0 0 16 15" fill="currentColor"><path d="M8 8.5a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM8 4.9c1.5 0 2.9.6 3.9 1.6l-1.4 1.4a3.6 3.6 0 0 0-5 0L4.1 6.5A5.6 5.6 0 0 1 8 4.9Zm0-4.2c2.7 0 5.2 1.1 7 2.9l-1.4 1.4a7.8 7.8 0 0 0-11.2 0L1 3.6A9.8 9.8 0 0 1 8 .7Z"/></svg>
      <svg width="22" height="15" viewBox="0 0 25 15" fill="none" stroke="currentColor"><rect x="0.5" y="1.5" width="20" height="12" rx="3.5"/><rect x="3" y="4" width="13" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 5.5v4" stroke-width="1.5" stroke-linecap="round"/></svg>
    </header>

    <!-- 子页导航 -->
    <header class="subnav" id="subnav">
      <a class="subnav__btn" id="btn-back" href="chat-room.html" aria-label="返回">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </a>
      <h1 class="subnav__title">Settings</h1>
      <div class="subnav__spacer" aria-hidden="true"></div>
    </header>

    <main class="chatset" id="chatset-main">

      <!-- 角色资料卡 -->
      <section class="profile-card glass" id="profile-card">
        <div class="avatar avatar--peer"><span class="avatar__initial">N</span></div>
        <div class="profile-card__body">
          <span class="profile-card__name">Nereus</span>
          <span class="profile-card__desc">海边的守灯人</span>
        </div>
      </section>

      <!-- 设置行 -->
      <section class="set-rows" id="set-rows" aria-label="聊天设置">
        <button class="set-row glass" id="btn-alias">
          <span class="set-row__label">备注</span>
          <span class="set-row__value">小灯</span>
          <i class="fa-solid fa-chevron-right set-row__arrow" aria-hidden="true"></i>
        </button>
        <button class="set-row glass" id="btn-bind-world">
          <span class="set-row__label">绑定世界书</span>
          <span class="set-row__value">潮汐镇</span>
          <i class="fa-solid fa-chevron-right set-row__arrow" aria-hidden="true"></i>
        </button>
        <button class="set-row glass" id="btn-chat-bg">
          <span class="set-row__label">聊天背景</span>
          <span class="set-row__value">默认</span>
          <i class="fa-solid fa-chevron-right set-row__arrow" aria-hidden="true"></i>
        </button>

        <!-- 气泡颜色(选中态: --active) -->
        <div class="bubble-card glass" id="bubble-color-card">
          <span class="bubble-card__label">气泡颜色</span>
          <div class="bubble-card__dots" role="radiogroup" aria-label="气泡颜色">
            <button class="bubble-dot bubble-dot--blue bubble-dot--active" id="bubble-blue" aria-label="蓝色" aria-checked="true" role="radio"></button>
            <button class="bubble-dot bubble-dot--cyan" id="bubble-cyan" aria-label="青色" role="radio"></button>
            <button class="bubble-dot bubble-dot--ivory" id="bubble-ivory" aria-label="米色" role="radio"></button>
            <button class="bubble-dot bubble-dot--lilac" id="bubble-lilac" aria-label="紫色" role="radio"></button>
            <button class="bubble-dot bubble-dot--rose" id="bubble-rose" aria-label="粉色" role="radio"></button>
          </div>
        </div>
      </section>

      <!-- 朋友圈 / 情侣空间 -->
      <section class="chatset-entries" aria-label="空间入口">
        <a class="entry-card glass" id="btn-moments" href="moments.html">
          <i class="fa-solid fa-circle-nodes" aria-hidden="true"></i>朋友圈
        </a>
        <a class="entry-card glass" id="btn-couple-space" href="couple-space.html">
          <i class="fa-solid fa-heart" aria-hidden="true"></i>情侣空间
        </a>
      </section>

    </main>

  </div>
  <script type="module" src="js/chat-app.js"></script>
</body>
</html>
